# node_exporter — static-binary component (M2 offline-bundle demo).
# A single static Go binary from GitHub: ideal for the offline path
# (download/extract on the control machine, push to target, no curl on target).
name: node_exporter
version_default: "1.8.2"
supported_os: [ubuntu, debian, rhel, centos, rocky]

preflight:
  - check: port_free
    port: 9100

install:
  # Downloaded to /tmp/crater-dl by default; offline mode pushes the blob there.
  - action: download
    url_tmpl: "https://github.com/prometheus/node_exporter/releases/download/v{{version}}/node_exporter-{{version}}.linux-amd64.tar.gz"
  - action: extract
    to: /usr/local/bin
    strip: 1
  - action: write_file
    dst: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network.target

      [Service]
      ExecStart=/usr/local/bin/node_exporter
      Restart=always
      User=root

      [Install]
      WantedBy=multi-user.target
  - action: systemd_unit
    name: node_exporter
    enable: true
    start: true

verify:
  - action: run_cmd
    cmd: "/usr/local/bin/node_exporter --version 2>&1 | head -1"
  - action: run_cmd
    cmd: "sleep 1; curl -s http://localhost:9100/metrics | head -1 || true"
