# Docker — first built-in component (M1 MVP / D-005).
# M1 uses the distro package path (robust, single end-to-end test target).
# Static-binary install (download/extract) is supported by the engine and can
# be added as an alternative profile later.
name: docker
version_default: "latest"
supported_os: [ubuntu, debian, rhel, centos, rocky]

preflight:
  - check: kernel_min
    version: "3.10"
  - check: disk_free
    path: /var/lib/docker
    min_gb: 5

install:
  # Debian/Ubuntu: docker.io pulls in containerd + a systemd unit and is in the
  # base repos. RHEL family: the `docker` / podman-docker package or fallback.
  - action: pkg_install
    packages:
      debian: [docker.io]
      rhel: [docker]
  # Registry mirror for China before (re)start.
  - action: render_template
    src: daemon.json.tmpl
    dst: /etc/docker/daemon.json
  - action: systemd_unit
    name: docker
    enable: true
    start: true

verify:
  - action: run_cmd
    cmd: "docker version --format '{{.Server.Version}}' || docker --version"
  - action: run_cmd
    cmd: "docker info --format 'Storage: {{.Driver}} | Cgroup: {{.CgroupDriver}}' 2>/dev/null || true"
