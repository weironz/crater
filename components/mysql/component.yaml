# mysql — single-node database (user's named target: `crater mysql`).
# Distro package path: Ubuntu/Debian ship `mysql-server` (service `mysql`);
# RHEL family ship `mysql-server` (service `mysqld`) — the start step tries both
# so one descriptor works across families without per-OS service-name support.
#
# Stateful-service exemplar: package install + service enable + readiness probe.
# Tuning (datadir, bind-address, root password) would be added via
# render_template once secrets handling lands.
name: mysql
version_default: "8.0"
supported_os: [ubuntu, debian, rhel, centos, rocky]

preflight:
  - check: port_free
    port: 3306
  - check: disk_free
    path: /var/lib/mysql
    min_gb: 2

install:
  - action: pkg_install
    packages:
      debian: [mysql-server]
      rhel: [mysql-server]
  - action: run_cmd
    cmd: "systemctl enable --now mysql 2>/dev/null || systemctl enable --now mysqld"

verify:
  - action: run_cmd
    cmd: "(mysql --version || mysqld --version) 2>&1 | head -1"
  - action: run_cmd
    cmd: "for i in $(seq 1 20); do (mysqladmin ping 2>/dev/null | grep -q alive) && break; sleep 2; done; mysqladmin ping 2>&1 || true"
