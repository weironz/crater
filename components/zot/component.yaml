# zot — a tiny OCI registry (project-zot). Single static binary + systemd.
# Used as crater's temporary/air-gap registry. Anonymous read+write by default
# (fine for a temp registry); add accessControl in config.json for real use.
name: zot
version_default: "2.1.17"
supported_os: [ubuntu, debian, rhel, centos, rocky]

install:
  - action: download
    url_tmpl: "https://github.com/project-zot/zot/releases/download/v{{version}}/zot-linux-amd64"
    dest: /usr/local/bin/zot
  - action: run_cmd
    cmd: "chmod +x /usr/local/bin/zot"
    check: "test -x /usr/local/bin/zot"
  - action: run_cmd
    cmd: "mkdir -p /etc/zot /var/lib/zot"
    check: "test -d /var/lib/zot"
  - action: write_file
    dst: /etc/zot/config.json
    content: |
      {
        "storage": { "rootDirectory": "/var/lib/zot" },
        "http": { "address": "0.0.0.0", "port": "5000" },
        "log": { "level": "info" }
      }
  - action: write_file
    dst: /etc/systemd/system/zot.service
    content: |
      [Unit]
      Description=zot OCI registry
      After=network.target

      [Service]
      ExecStart=/usr/local/bin/zot serve /etc/zot/config.json
      Restart=always
      User=root

      [Install]
      WantedBy=multi-user.target
  - action: systemd_unit
    name: zot
    enable: true
    start: true

verify:
  - action: run_cmd
    cmd: "for i in $(seq 1 15); do curl -sf http://localhost:5000/v2/ -o /dev/null && break; sleep 1; done; curl -s -o /dev/null -w 'zot /v2/ -> %{http_code}\\n' http://localhost:5000/v2/"
