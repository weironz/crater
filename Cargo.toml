[workspace]
resolver = "2"
members = ["crates/crater-core", "crates/crater-cli", "crates/crater-ir"]

# Dev-build speed (D-079): cut debug-info volume (codegen + linker handle far less
# data) while keeping backtraces; deps get no debug info at all — we never step
# into them — shrinking the link further. Pair with mold (.cargo/config.toml).
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# Release = the SHIPPED binary (also pushed to targets in agent mode), so优化体积:
# strip 符号 + 跨 crate LTO + 单 codegen 单元 + panic=abort(去 unwind 表)。
# 100MB debug → ~一二十 MB。构建较慢(一次性)。
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/weironz/crater"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
russh = "0.45"             # M1: SSH executor (pure Rust; API pinned to 0.45.x)
base64 = "0.22"            # M1: push rendered files to target via base64
minijinja = "2"            # D-075: template-layer rendering (declarative iteration)
# M2: offline bundle build/deploy + M4 AI (reqwest shared)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tar = "0.4"                # bundle packing (tar layer)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }  # pure-Rust gzip, no C toolchain
sha2 = "0.10"             # checksum verification

# --- Deferred deps (uncomment as each feature lands) ---
# indicatif = "0.17"        # progress bars
# oci-client = "0.12"       # OCI image bundles (later)
# zstd = "0.13"             # zstd compression (later; needs C toolchain)
