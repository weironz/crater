# D-037-b:task 模型的 register/hostvars(D-030 机制)。
# first 组(roles:[first])先跑、注册 ip;second 组后跑,用 {{ hostvars.n11.ip }}。
name: cross-node-task
hosts: all
register:
  - name: ip
    cmd: "hostname -I | awk '{print $1}'"
actions:
  - id: note_peer
    action: shell
    cmd: "echo 'first-node = {{ hostvars.n11.ip }}' > /tmp/crater-peer; cat /tmp/crater-peer"
