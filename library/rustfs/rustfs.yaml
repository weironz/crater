# rustfs(task):S3 兼容对象存储,**二进制 + systemd 部署**(官方 Linux 安装路线)。
# 三种形态同一份 yaml,由 volumes 一个参数驱动(与官方 RUSTFS_VOLUMES 语法 1:1):
#   单机单盘  (默认)         volumes=/data/rustfs0
#   单机多盘  --set volumes='/data/rustfs{0...3}'
#   多机多盘  -i inv.yaml --set volumes='http://node{1...4}:9000/data/rustfs{0...3}'
#             (volumes 里的每个节点都要在 inventory 里;主机名需可解析,preflight 会查)
# 上游只发 zip:物料声明 unzip: rustfs,控制端解包出二进制(D-103),目标机零依赖。
# musl 静态二进制 + amd64/arm64 双物料变体 → 不需要 requires(发行版/架构都不限)。
name: rustfs
hosts: all
params:
  version:
    description: RustFS 版本(GitHub release tag)
    default: "1.0.0-beta.7"
    stage: build
  volumes:
    description: RUSTFS_VOLUMES 表达式,决定单机单盘/单机多盘/多机多盘(见顶部注释)
    default: "/data/rustfs0"
    stage: apply
  port:
    description: S3 端点端口
    default: "9000"
    stage: apply
  access_key:
    description: 管理凭据(生产务必用 inventory vars 或 --set 覆盖,D-082)
    default: "crater-admin"
    stage: apply
  secret_key:
    description: 管理凭据(生产务必覆盖)
    default: "crater-changeme"
    stage: apply
  bypass_disk_check:
    description: "true 时跳过 rustfs 的物理磁盘独立性校验(多盘目录同一块盘时必需)——仅测试/CI,生产保持 false"
    default: "false"
    stage: apply
materials:
  # 上游 zip 内只有一个 rustfs 二进制 —— unzip 在控制端抽出它(D-103)。
  # sha256 不钉:钉了会跨版本失配;version 钉 release tag 已保证可复现。
  - name: rustfs-bin
    kind: file
    arch: amd64
    url_tmpl: "https://github.com/rustfs/rustfs/releases/download/{{version}}/rustfs-linux-x86_64-musl-v{{version}}.zip"
    unzip: rustfs
  - name: rustfs-bin
    kind: file
    arch: arm64
    url_tmpl: "https://github.com/rustfs/rustfs/releases/download/{{version}}/rustfs-linux-aarch64-musl-v{{version}}.zip"
    unzip: rustfs
actions:
  - id: port_free
    # 端口被"别人"占(比如旧容器化部署的 rustfs)→ 服务会 Address-in-use 崩,
    # 而 health 探针还被冒名顶替返回 200 —— 必须在动手前响亮拒绝。
    # 自己的 rustfs.service 在跑 = 重复 apply,放行。
    action: shell
    phase: preflight
    cmd: |
      systemctl is-active --quiet rustfs && exit 0
      if ss -ntl 2>/dev/null | grep -q ":{{port}} "; then
        echo "端口 {{port}} 已被其它进程占用(rustfs.service 未在跑)——先清掉占用者(旧容器化部署用 docker rm -f rustfs)" >&2
        exit 1
      fi
  - id: nodes_resolvable
    # 多机多盘:volumes 是 http://node{1...4}:9000/... ,每台都必须能解析
    # 其它节点的主机名,否则集群无法组建(官方要求 /etc/hosts 或 DNS)。
    # 单机形态(无 http 前缀)直接通过。展开函数同 data_dirs,见其注释。
    action: shell
    phase: preflight
    cmd: |
      case '{{volumes}}' in http*) ;; *) exit 0 ;; esac
      expand() { local pre rest range post i e; case "$1" in
        *\{*...*\}*) pre=${1%%\{*}; rest=${1#*\{}; range=${rest%%\}*}; post=${rest#*\}}
          i=${range%%.*}; e=${range##*.}
          while [ "$i" -le "$e" ]; do expand "$pre$i$post"; i=$((i+1)); done ;;
        *) printf '%s\n' "$1" ;;
      esac; }
      miss=''
      for h in $(for v in '{{volumes}}'; do expand "$v"; done | sed -E 's|^https?://||; s|[:/].*||' | sort -u); do
        case "$h" in *[!0-9.]*) ;; *) continue ;; esac   # 纯 IP 字面量无需解析
        getent hosts "$h" >/dev/null 2>&1 || miss="$miss $h"
      done
      [ -z "$miss" ] || { echo "无法解析节点:$miss(补 /etc/hosts 或 DNS 后重试)" >&2; exit 1; }
  - id: binary
    action: copy
    material: rustfs-bin
    dest: /usr/local/bin/rustfs
    mode: "0755"
    notify: [restart_rustfs]
  - id: data_dirs
    # 本机数据目录从 volumes 推导:展开 {a...b} 区间、剥掉 http://host:port
    # 前缀(多机形态下每个节点的本地盘路径相同,这正是官方 MNMD 的约定)。
    # POSIX sh,dash/bash 都可跑;mkdir -p 幂等,check 探所有目录已存在。
    action: shell
    cmd: |
      expand() { local pre rest range post i e; case "$1" in
        *\{*...*\}*) pre=${1%%\{*}; rest=${1#*\{}; range=${rest%%\}*}; post=${rest#*\}}
          i=${range%%.*}; e=${range##*.}
          while [ "$i" -le "$e" ]; do expand "$pre$i$post"; i=$((i+1)); done ;;
        *) printf '%s\n' "$1" ;;
      esac; }
      for v in '{{volumes}}'; do expand "$v"; done | sed -E 's|^https?://[^/]*||' | sort -u |
      while read -r d; do mkdir -p "$d" && chmod 750 "$d"; done
    check: |
      expand() { local pre rest range post i e; case "$1" in
        *\{*...*\}*) pre=${1%%\{*}; rest=${1#*\{}; range=${rest%%\}*}; post=${rest#*\}}
          i=${range%%.*}; e=${range##*.}
          while [ "$i" -le "$e" ]; do expand "$pre$i$post"; i=$((i+1)); done ;;
        *) printf '%s\n' "$1" ;;
      esac; }
      for d in $(for v in '{{volumes}}'; do expand "$v"; done | sed -E 's|^https?://[^/]*||' | sort -u); do
        test -d "$d" || exit 1
      done
  - id: log_dir
    action: file
    path: /var/logs/rustfs
    state: directory
    mode: "0750"
  - id: config
    # 官方环境文件;改凭据/端口/volumes → notify 重启收敛。
    action: copy
    content: |
      RUSTFS_ACCESS_KEY={{access_key}}
      RUSTFS_SECRET_KEY={{secret_key}}
      RUSTFS_VOLUMES="{{volumes}}"
      RUSTFS_ADDRESS=":{{port}}"
      RUSTFS_CONSOLE_ENABLE=true
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK={{bypass_disk_check}}
      RUST_LOG=error
      RUSTFS_OBS_LOG_DIRECTORY="/var/logs/rustfs/"
    dest: /etc/default/rustfs
    mode: "0600"
    notify: [restart_rustfs]
  - id: unit
    action: copy
    content: |
      [Unit]
      Description=RustFS S3-compatible object storage (crater)
      After=network-online.target
      [Service]
      EnvironmentFile=-/etc/default/rustfs
      ExecStart=/usr/local/bin/rustfs $RUSTFS_VOLUMES
      Restart=on-failure
      RestartSec=2
      LimitNOFILE=1048576
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/rustfs.service
    mode: "0644"
    notify: [restart_rustfs]
  - id: svc
    action: service
    name: rustfs
    state: started
    enabled: true
    needs: [binary, data_dirs, log_dir, config, unit]
  - id: wait_ready
    # 等 S3 端点开门(wait_for,D-104)。多机形态首启要等所有节点到齐
    # 组建纠删码集,30s 窗口。
    action: wait_for
    port: "{{port}}"
    timeout: 30
    phase: verify
    needs: [svc]
  - id: verify
    # 先核身份(rustfs.service 真在跑,防别的进程冒名顶替占着端口答 200),再探健康。
    action: shell
    phase: verify
    cmd: "systemctl is-active --quiet rustfs || { echo 'rustfs.service 未运行' >&2; journalctl -u rustfs -n 5 --no-pager >&2; exit 1; }; curl -s -o /dev/null -w 'rustfs s3 /health -> %{http_code}\\n' http://localhost:{{port}}/health"
    needs: [wait_ready]
handlers:
  - id: restart_rustfs
    action: service
    name: rustfs
    state: restarted
teardown:
  - id: svc_off
    action: service
    name: rustfs
    state: stopped
    enabled: false
  - id: rm_unit
    action: file
    path: /etc/systemd/system/rustfs.service
    state: absent
    needs: [svc_off]
  - id: rm_config
    action: file
    path: /etc/default/rustfs
    state: absent
    needs: [svc_off]
  - id: rm_binary
    action: file
    path: /usr/local/bin/rustfs
    state: absent
    needs: [svc_off]
  - id: rm_logs
    action: file
    path: /var/logs/rustfs
    state: absent
    needs: [svc_off]
  - id: rm_data
    # 对象数据(运行期长出来的)也删 —— delete 即彻底卸载;只想停服务别用 delete。
    action: shell
    cmd: |
      expand() { local pre rest range post i e; case "$1" in
        *\{*...*\}*) pre=${1%%\{*}; rest=${1#*\{}; range=${rest%%\}*}; post=${rest#*\}}
          i=${range%%.*}; e=${range##*.}
          while [ "$i" -le "$e" ]; do expand "$pre$i$post"; i=$((i+1)); done ;;
        *) printf '%s\n' "$1" ;;
      esac; }
      for v in '{{volumes}}'; do expand "$v"; done | sed -E 's|^https?://[^/]*||' | sort -u |
      while read -r d; do rm -rf "$d"; done
    needs: [svc_off]
