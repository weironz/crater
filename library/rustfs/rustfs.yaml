# rustfs(task):S3 兼容对象存储,**二进制 + systemd 部署**(官方 Linux 安装路线)。
# 三种形态同一份 yaml,volumes(与官方 RUSTFS_VOLUMES 语法 1:1)+ data_dirs 两个
# apply 参数驱动——环境配置进 inventory vars(D-082),不写进制品:
#   单机单盘  (默认)volumes=/data/rustfs0
#   单机多盘  volumes=/data/rustfs{0...3}                       + data_dirs 列全 4 目录
#   多机多盘  volumes=http://node{1...4}:9000/data/rustfs{0...3} + data_dirs 列全(见
#             inventory.example.yaml;节点主机名需各机可解析,时间需同步)
# 显式优于推导:data_dirs 直接声明本机数据目录(空格分隔),不从 volumes 的
# {a...b} 区间表达式反推——两者不一致时 rustfs 启动自会报错。
# 上游只发 zip:物料声明 unzip: rustfs,控制端解包出二进制(D-103),目标机零依赖。
# musl 静态二进制 + amd64/arm64 双物料变体 → 不需要 requires(发行版/架构都不限)。
name: rustfs
hosts: all
params:
  version:
    description: RustFS 版本(GitHub release tag)
    default: "1.0.0-beta.7"
    stage: build
  volumes:
    description: RUSTFS_VOLUMES 表达式,决定单机单盘/单机多盘/多机多盘(见顶部注释)
    default: "/data/rustfs0"
    stage: apply
  data_dirs:
    description: 本机数据目录列表(空格分隔),与 volumes 的本地路径一致;多机时各节点同值
    default: "/data/rustfs0"
    stage: apply
  port:
    description: S3 端点端口
    default: "9000"
    stage: apply
  access_key:
    description: 管理凭据(生产务必用 inventory vars 或 --set 覆盖,D-082)
    default: "crater-admin"
    stage: apply
  secret_key:
    description: 管理凭据(生产务必覆盖)
    default: "crater-changeme"
    stage: apply
  bypass_disk_check:
    description: "true 时跳过 rustfs 的物理磁盘独立性校验(多盘目录同一块盘时必需)——仅测试/CI,生产保持 false"
    default: "false"
    stage: apply
materials:
  # 上游 zip 内只有一个 rustfs 二进制 —— unzip 在控制端抽出它(D-103)。
  # sha256 不钉:钉了会跨版本失配;version 钉 release tag 已保证可复现。
  - name: rustfs-bin
    kind: file
    arch: amd64
    url_tmpl: "https://github.com/rustfs/rustfs/releases/download/{{version}}/rustfs-linux-x86_64-musl-v{{version}}.zip"
    unzip: rustfs
  - name: rustfs-bin
    kind: file
    arch: arm64
    url_tmpl: "https://github.com/rustfs/rustfs/releases/download/{{version}}/rustfs-linux-aarch64-musl-v{{version}}.zip"
    unzip: rustfs
actions:
  # 端口闸(wait_for state: stopped + loop,D-104/105):被占就直接退,不管
  # 占用者是谁(严格语义)。S3 口与控制台口(上游默认 9001)都查——旧容器化
  # 部署映射的是 9000-9001 两个口,只查一个会漏半截。
  - id: port_free
    action: wait_for
    port: "{{item}}"
    state: stopped
    timeout: 3
    phase: preflight
    loop: [9000, 9001]
  - id: binary
    action: copy
    material: rustfs-bin
    dest: /usr/local/bin/rustfs
    mode: "0755"
    notify: [restart_rustfs]
  - id: data_dirs
    # data_dirs 是声明好的目录列表(空格分隔,shell 自然分词),不做任何推导。
    action: shell
    cmd: "mkdir -p {{data_dirs}} && chmod 750 {{data_dirs}}"
    check: "for d in {{data_dirs}}; do test -d \"$d\" || exit 1; done"
  - id: log_dir
    action: file
    path: /var/logs/rustfs
    state: directory
    mode: "0750"
  - id: config
    # 官方环境文件;改凭据/端口/volumes → notify 重启收敛。
    action: copy
    content: |
      RUSTFS_ACCESS_KEY={{access_key}}
      RUSTFS_SECRET_KEY={{secret_key}}
      RUSTFS_VOLUMES="{{volumes}}"
      RUSTFS_ADDRESS=":{{port}}"
      RUSTFS_CONSOLE_ENABLE=true
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK={{bypass_disk_check}}
      RUST_LOG=error
      RUSTFS_OBS_LOG_DIRECTORY="/var/logs/rustfs/"
    dest: /etc/default/rustfs
    mode: "0600"
    notify: [restart_rustfs]
  - id: unit
    action: copy
    content: |
      [Unit]
      Description=RustFS S3-compatible object storage (crater)
      After=network-online.target
      [Service]
      EnvironmentFile=-/etc/default/rustfs
      ExecStart=/usr/local/bin/rustfs $RUSTFS_VOLUMES
      Restart=on-failure
      RestartSec=2
      LimitNOFILE=1048576
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/rustfs.service
    mode: "0644"
    notify: [restart_rustfs]
  - id: svc
    action: service
    name: rustfs
    state: started
    enabled: true
    needs: [binary, data_dirs, log_dir, config, unit]
  - id: wait_ready
    # 等 S3 端点开门(wait_for,D-104)。多机形态首启要等所有节点到齐
    # 组建纠删码集,30s 窗口。
    action: wait_for
    port: "{{port}}"
    timeout: 30
    phase: verify
    needs: [svc]
  - id: verify
    # 先核身份(rustfs.service 真在跑,防别的进程冒名顶替占着端口答 200),再探健康。
    action: shell
    phase: verify
    cmd: "systemctl is-active --quiet rustfs || { echo 'rustfs.service 未运行' >&2; journalctl -u rustfs -n 5 --no-pager >&2; exit 1; }; curl -s -o /dev/null -w 'rustfs s3 /health -> %{http_code}\\n' http://localhost:{{port}}/health"
    needs: [wait_ready]
handlers:
  - id: restart_rustfs
    action: service
    name: rustfs
    state: restarted
teardown:
  - id: svc_off
    action: service
    name: rustfs
    state: stopped
    enabled: false
  - id: rm_unit
    action: file
    path: /etc/systemd/system/rustfs.service
    state: absent
    needs: [svc_off]
  - id: rm_config
    action: file
    path: /etc/default/rustfs
    state: absent
    needs: [svc_off]
  - id: rm_binary
    action: file
    path: /usr/local/bin/rustfs
    state: absent
    needs: [svc_off]
  - id: rm_logs
    action: file
    path: /var/logs/rustfs
    state: absent
    needs: [svc_off]
  - id: rm_data
    # 对象数据(运行期长出来的)也删 —— delete 即彻底卸载;只想停服务别用 delete。
    action: shell
    cmd: "rm -rf {{data_dirs}}"
    needs: [svc_off]
