# rustfs(task):S3 兼容对象存储,**容器化部署**(docker run)。
# 不装 docker —— preflight 只检查 docker 就绪,缺了响亮报错(装 docker 用 `crater apply docker`)。
# 镜像声明为 kind: image 物料:在线 docker pull;build 打成 oci-archive,离线 import(D-061)。
name: rustfs
hosts: all
vars:
  version: "1.0.0-beta.5"      # 镜像 tag(钉具体版本才严格幂等);--set version=X 可覆盖
  data_dir: "/data/rustfs"
  api_port: "9000"             # S3 端点(宿主机映射 → 容器 9000)
  console_port: "9001"         # Web 控制台(宿主机映射 → 容器 9001)
  # 1.0.0-beta.5 起,绑非环回地址时**拒绝**上游默认凭据 rustfsadmin/rustfsadmin
  # (容器 FATAL 反复重启)。这里给非默认占位值,生产务必用 inventory vars 覆盖(D-082)。
  access_key: "crater-admin"
  secret_key: "crater-changeme"
materials:
  - name: rustfs-img
    kind: image
    ref: "docker.io/rustfs/rustfs:{{version}}"
actions:
  - id: docker_ready
    action: shell
    phase: preflight
    cmd: "docker info >/dev/null 2>&1 || { echo 'docker 未就绪:请先部署 docker(crater apply docker)' >&2; exit 1; }"
  - id: data_dir
    # 镜像内进程跑在 uid 10001(rustfs)下,bind mount 的宿主机目录必须可写,
    # 否则容器 FATAL: Permission denied 反复重启。
    action: file
    path: /data/rustfs
    state: directory
    owner: "10001"
    group: "10001"
  - id: img
    # 在线:docker pull;离线:推包内 oci-archive 并 import(同一份 yaml,来源由形态定)
    action: load_image
    material: rustfs-img
    runtime: docker
    needs: [docker_ready]
  - id: run
    # 收敛语义:容器起来时打一个"参数指纹"label(版本+端口+凭据),探针按
    # name+running+label 三过滤比对 —— **任何参数变了**(不只版本)指纹就不符,
    # 自动删旧起新;全符合 → 跳过(幂等)。没容器/崩溃重启中同样不符 → 重建。
    action: shell
    cmd: >-
      docker rm -f rustfs 2>/dev/null;
      docker run -d --name rustfs --restart unless-stopped
      --label crater_spec={{version}}_{{api_port}}_{{console_port}}_{{access_key}}_{{secret_key}}
      -p {{api_port}}:9000
      -p {{console_port}}:9001
      -v {{data_dir}}:/data
      -e RUSTFS_ACCESS_KEY={{access_key}}
      -e RUSTFS_SECRET_KEY={{secret_key}}
      docker.io/rustfs/rustfs:{{version}}
    check: >-
      docker ps --filter name=^rustfs$ --filter status=running
      --filter label=crater_spec={{version}}_{{api_port}}_{{console_port}}_{{access_key}}_{{secret_key}}
      -q | grep -q .
    needs: [img, data_dir]
  - id: verify
    action: shell
    phase: verify
    cmd: "for i in $(seq 1 15); do curl -s -o /dev/null http://localhost:{{api_port}}/health && break; sleep 1; done; curl -s -o /dev/null -w 'rustfs api /health -> %{http_code}\\n' http://localhost:{{api_port}}/health && curl -s -o /dev/null -w 'rustfs console /rustfs/console/ -> %{http_code}\\n' http://localhost:{{console_port}}/rustfs/console/"
    needs: [run]
teardown:
  - id: rm_container
    action: shell
    cmd: "docker rm -f rustfs 2>/dev/null || true"
    check: "! docker ps -a --filter name=^rustfs$ -q | grep -q ."
  # 数据目录(对象数据,容器运行期长出来的):
  - id: rm_data
    action: file
    path: /data/rustfs
    state: absent
    needs: [rm_container]
  # 镜像本身不删:可能被别的容器复用;要清理手动 docker rmi
