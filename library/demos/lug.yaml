# D-037-b 原语:group / user / lineinfile。全声明式,幂等在引擎(D-036)。
name: lug-demo
hosts: all
actions:
  - id: grp
    action: group
    name: craterdemo
    system: true

  - id: usr
    action: user
    name: crateruser
    system: true
    shell: /usr/sbin/nologin
    groups: [craterdemo]
    needs: [grp]

  - id: line
    action: lineinfile
    path: /etc/crater-demo.conf
    line: "max_connections=100"
    regexp: "^max_connections="
    create: true
