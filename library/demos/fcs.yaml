# D-037-b 原语演示:file(建目录)+ copy(推配置)+ service(确保服务起)。
# 全部声明式;幂等/排序由引擎处理(D-036)。
name: fcs-demo
hosts: all
actions:
  - id: dir
    action: file
    path: /etc/crater-demo
    state: directory
    mode: "0755"

  - id: conf
    action: copy
    src: files/app.conf
    dest: /etc/crater-demo/app.conf
    mode: "0644"
    needs: [dir]

  - id: ssh_up
    action: service
    name: ssh
    state: started
    enabled: true
    phase: verify
