# zot(task):OCI registry。copy 二进制(material) + 建目录 + 推 config/unit + 起服务。
# config 变更 → notify 重启 handler。
name: zot
hosts: all
vars:
  version: "2.1.17"
materials:
  - name: zot-bin
    kind: file
    arch: amd64    # 官方另有 arm64 包,需要时加一条 arch: arm64 变体即可
    url_tmpl: "https://github.com/project-zot/zot/releases/download/v{{version}}/zot-linux-{{arch}}"
  # 自建配置(无下载源)→ files/ 私有文件,build 打成 embedded blob(离线随 recipe 走)。
  - name: zot-config
    kind: file
    src: files/config.json
  - name: zot-unit
    kind: file
    src: files/zot.service
actions:
  - id: bin
    action: copy
    material: zot-bin
    dest: /usr/local/bin/zot
    mode: "0755"
  - id: dir
    action: file
    path: /var/lib/zot
    state: directory
  - id: config
    action: copy
    material: zot-config
    dest: /etc/zot/config.json
    notify: [restart_zot]
  - id: unit
    action: copy
    material: zot-unit
    dest: /etc/systemd/system/zot.service
    needs: [bin, dir, config]
  - id: svc
    action: service
    name: zot
    state: started
    enabled: true
    needs: [unit]
  - id: wait_ready
    # 等 registry 开门(wait_for,D-104);端口随 files/config.json(5000)。
    action: wait_for
    port: 5000
    timeout: 15
    phase: verify
    needs: [svc]
  - id: verify
    action: shell
    phase: verify
    cmd: "curl -s -o /dev/null -w 'zot /v2/ -> %{http_code}\\n' http://localhost:5000/v2/"
    needs: [wait_ready]
handlers:
  - id: restart_zot
    action: service
    name: zot
    state: restarted
