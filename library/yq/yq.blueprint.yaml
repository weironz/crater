# yq —— 单二进制工具下发。最小交付包长什么样。
name: yq
version: "1"
description: yq 命令行 YAML 处理器

params:
  # stage: build —— 这个参数在**烤闭包**时就要定死(它决定下载哪个 URL),
  # 不是部署时才问。UI 的参数表单会据此标注。
  version: { default: "4.53.6", stage: build, desc: "上游 release tag" }
  # 摘要也是参数,和 version 成对 —— 这样一份蓝图能发出任意版本的包:
  #   crater pkg push library/yq <ref>:4.44.3 \
  #     --set version=4.44.3 --set sha_amd64=… --set sha_arm64=…
  # 只 --set 版本而不换摘要,落地时会摘要不符 —— 那是**对的**,内容寻址
  # 就该在这里拦住(实测过)。
  sha_amd64: { default: "c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385", stage: build, desc: "yq_linux_amd64 的 sha256" }
  sha_arm64: { default: "88a1016bc1d657375a35864e4f44b6f333df8ff97b559f51bba0adcb2169df09", stage: build, desc: "yq_linux_arm64 的 sha256" }

materials:
  # 同名两条,靠 `when:` 分成变体 —— 每个架构有**自己的**摘要。
  #
  # 为什么不能只写一条带 `${substrate.arch}` 的 URL 再配一个 sha256:那个摘要
  # 只对其中一个架构成立,另一个架构上会落地即失败。物料的变体机制就是为这个
  # 存在的:同名多条,由目标侧事实判定用哪个。
  #
  # **摘要与 `version` 必须同时改。** 版本变了摘要就不对,而不对的表现是
  # 落地失败 —— 那正是内容寻址该有的样子(与 library/k8s 同一条纪律)。
  #
  # 有了摘要,plan 期就能内容寻址比对:目标机上那份 yq 是不是这一版,
  # crater 判得出来。没有它,换版本时 apply **什么都不会做**,而且会明说
  # 自己判不出(D-135)—— 那正是 yq 此前的处境。
  - name: yq-bin
    when: "substrate.arch == 'amd64'"
    file: "https://github.com/mikefarah/yq/releases/download/v${params.version}/yq_linux_amd64"
    sha256: "${params.sha_amd64}"
  - name: yq-bin
    when: "substrate.arch == 'arm64'"
    file: "https://github.com/mikefarah/yq/releases/download/v${params.version}/yq_linux_arm64"
    sha256: "${params.sha_arm64}"

resources:
  - copy: { material: yq-bin, dest: /usr/local/bin/yq, mode: "0755" }

health:
  - cmd: { run: "yq --version" }
