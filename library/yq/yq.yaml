name: yq
description: "install yq"
hosts: all

vars:
  version: "4.44.3"

materials:
  - name: yq-bin
    kind: file
    arch: amd64
    url_tmpl: "https://github.com/mikefarah/yq/releases/download/v{{version}}/yq_linux_{{arch}}"

actions:
  - id: install
    action: copy
    material: yq-bin
    dest: /usr/local/bin/yq
    mode: "0755"
