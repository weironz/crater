name: yq
description: "install yq"
hosts: all                      # all / 组名 / 主机名

vars:
  version: "4.44.3"             # 默认版本;crater build --set version=X 可覆盖

materials:
  - name: yq-bin
    kind: file
    url_tmpl: "https://github.com/mikefarah/yq/releases/download/v{{version}}/yq_linux_amd64"

actions:
  - id: install
    action: place
    material: yq-bin
    dest: /usr/local/bin/yq
    mode: "0755"
