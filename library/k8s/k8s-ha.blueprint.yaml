# Kubernetes HA —— 新 IR blueprint(D-106 起的形态)。
#
# 对照物:同目录 `k8s-ha.yaml`(旧 task 模型,519 行)。这份迁移的意义不只是"更短",
# 而是把三类东西**分开**:
#   资源      = 期望态(基线 / 运行时 / 二进制 / LB),可 observe、可 diff、可退役
#   procedure = 过程知识(kubeadm 那支舞),被调用而非被编写
#   types     = 把舞封装进名词(`cluster_member`),操作者永远不写 init/join
#
# 拓扑由 inventory 的组决定,与旧版一致:
#   单节点     : 1 台 controlplane
#   1 主 N 从   : 1 台 controlplane + N 台 worker
#   HA 多主多从 : M 台 controlplane + N 台 worker(默认每台 master 本机 Nginx 做 L4 转发)
# `cast.seed`(= first(role.controlplane))即 init 节点 —— 不再需要"全组跑 + check 守卫跳过首台"。
name: k8s-ha
# 包配方修订号；实际安装的 Kubernetes 版本由下方 params.version 决定，当前为 1.36.1。
version: "1.36.5"

# 机群契约:不满足就根本不开跑,而不是跑到 rest(...) 那步才炸。
# worker 写 min: 0 —— 单节点拓扑里 worker 组存在但为空,是合法拓扑不是打错字。
fleet:
  groups:
    controlplane: {min: 1}
    worker:       {min: 0}

# 选角表:定址逻辑单点定义。改"谁是引导节点"只需改这一行。
cast:
  seed:      first(role.controlplane)   # 引导节点:kubeadm init 在这里跑
  followers: rest(role.controlplane)    # 其余控制面:join --control-plane
  masters:   role.controlplane
  workers:   role.worker
description: "Kubernetes(单节点 / 1主N从 / 多主多从),本机 Nginx HA + kubeadm"

requires:
  os: [{ distro: ubuntu, versions: ["24.04"] }]
  arch: [amd64]

params:
  # 单节点 / 1主N从 不需要前置 LB。多 master 时,默认在每台控制面启动一个仅监听
  # 127.0.0.1:8443 的 Nginx stream 代理 —— kubeadm 的控制面 join 走本机代理,
  # 不需要 VIP、VRRP 或额外参数。
  ha:              { type: bool, default: false, desc: "多 master:启用控制面内部负载均衡" }
  ha_mode:         { type: { enum: [nginx-local, vip] }, default: nginx-local, desc: "HA LB: nginx-local(默认,无需 VIP)；vip(兼容旧 Keepalived+HAProxy)" }
  api_endpoint:    { default: "k8s-api.crater.internal", desc: "内部 API LB 的稳定 DNS 名(默认由本包写入所有节点 /etc/hosts)" }
  # 预载镜像是**离线**才需要的:在线部署时 kubeadm 自己会拉。
  # 打开它要求 OCI 闭包就位(尚未接入新管线,见 D-115)。
  preload_images:  { type: bool, default: false, desc: "离线:把镜像预先导入目标运行时" }
  version:         { type: version, default: "1.36.1", stage: build }
  # 下面三项只给 ha_mode=vip 的兼容路径使用；默认 nginx-local 无需填写。
  vip:             { type: ip,   default: "192.168.73.200", desc: "控制面 VIP(仅 ha_mode=vip)" }
  cp_endpoint:     { default: "", desc: "kubeadm --control-plane-endpoint(仅 ha_mode=vip，如 192.168.73.200:8443)" }
  subnet:          { type: cidr, default: "192.168.73.0/24", desc: "VIP 所在子网(keepalived 选网卡)" }
  pod_cidr:        { type: cidr, default: "10.244.0.0/16" }
  timezone:        { default: "Asia/Shanghai", desc: "机群统一时区(IANA 名)" }
  ntp_servers:     { type: [string], default: ["ntp.aliyun.com", "cn.pool.ntp.org"],
                     desc: "NTP 源;境外部署改成 pool.ntp.org 之类" }
  image_repo:      { default: "registry.aliyuncs.com/google_containers" }
  apiserver_port:  { type: port, default: 6443, desc: "haproxy 后端各 master 的 apiserver 口" }
  containerd_ver:  { default: "2.3.1",  stage: build }
  runc_ver:        { default: "1.4.2",  stage: build }
  cni_ver:         { default: "1.9.1",  stage: build }
  crictl_ver:      { default: "1.36.0", stage: build }
  coredns_ver:     { default: "1.14.2", stage: build }
  etcd_ver:        { default: "3.6.8-0", stage: build }
  pause_ver:       { default: "3.10.2", stage: build }
  flannel_ver:     { default: "0.28.4", stage: build }
  flannel_cni_ver: { default: "1.9.1-flannel1", stage: build }

materials:
  # —— 版本即变体维度 ——
  #
  # 摘要属于**某一个具体版本**,不属于"kubeadm"这个名字。所以"支持升级到 1.37"
  # 不是给 URL 里插一个变量就完事 —— 那样摘要必然对不上,而对不上就意味着
  # 内容寻址失效,离线闭包也就不再可信。
  #
  # 正确的表达是把版本当成**变体**(与多架构同一个机制):每个版本一条,各带
  # 各的摘要,由 `params.version` 选。代价是升级要加三行;换来的是:
  #   - `crater build` 会把**两个版本**都烤进同一个闭包 → 升级零下载;
  #   - 回滚就是把 version 改回去,同一个闭包里就有旧版字节;
  #   - 任何时刻"这个二进制该是什么内容"都有确定答案。
  #
  # containerd/runc/cni 不随 k8s 版本走,所以它们仍是单一条目。

  # —— 二进制 ——
  # 摘要取自各上游官方 checksum 文件,与上面的 *_ver 一一对应 ——
  # 改版本必须同时改摘要,否则落地即失败(这正是内容寻址该有的样子)。
  # 有了它,plan 期就能内容寻址比对,verify 不再只能报"说不清"。
  - name: containerd
    file: "https://github.com/containerd/containerd/releases/download/v${params.containerd_ver}/containerd-${params.containerd_ver}-linux-${substrate.arch}.tar.gz"
    sha256: "628448bd973610c656c1cbea8e88b32fafd85b23cc1aa4a3372eb7198478c054"
  - name: runc
    file: "https://github.com/opencontainers/runc/releases/download/v${params.runc_ver}/runc.${substrate.arch}"
    sha256: "ac8a90f9e225bb9322189937b230cdc5478d5753f0e31e1bda98a5cf06bd9539"
  - name: cni-plugins
    file: "https://github.com/containernetworking/plugins/releases/download/v${params.cni_ver}/cni-plugins-linux-${substrate.arch}-v${params.cni_ver}.tgz"
    sha256: "b98f74a0f8522f0a83867178729c1aa70f2158f90c45a2ca8fa791db1c76b303"
  - name: crictl
    file: "https://github.com/kubernetes-sigs/cri-tools/releases/download/v${params.crictl_ver}/crictl-v${params.crictl_ver}-linux-${substrate.arch}.tar.gz"
    sha256: "83855e114566a8a8c44c548d515670f51de3a5e1da8b2effb59870e2f10c25a3"
  - name: kubeadm
    file: "https://dl.k8s.io/release/v1.36.1/bin/linux/${substrate.arch}/kubeadm"
    sha256: "f35980333a4dae753807345ae359eca03f48f9945855e6a6a6708fe8b3b24038"
    when: "params.version == '1.36.1'"
  - name: kubeadm
    file: "https://dl.k8s.io/release/v1.37.0/bin/linux/${substrate.arch}/kubeadm"
    sha256: "9406f2e75c7fc99391f5fb0575b07914f2d90750d2b8c2c473e9c9c5194c9352"
    when: "params.version == '1.37.0'"
  - name: kubelet
    file: "https://dl.k8s.io/release/v1.36.1/bin/linux/${substrate.arch}/kubelet"
    sha256: "7efa1780c73d9fb3a464002864e582eb2d15aa691e475eaae323093d08feae14"
    when: "params.version == '1.36.1'"
  - name: kubelet
    file: "https://dl.k8s.io/release/v1.37.0/bin/linux/${substrate.arch}/kubelet"
    sha256: "ee554f77da57ad40a5d5f8625ac9c4af8b75d9d5a259367a885e5e816954b044"
    when: "params.version == '1.37.0'"
  - name: kubectl
    file: "https://dl.k8s.io/release/v1.36.1/bin/linux/${substrate.arch}/kubectl"
    sha256: "629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7"
    when: "params.version == '1.36.1'"
  - name: kubectl
    file: "https://dl.k8s.io/release/v1.37.0/bin/linux/${substrate.arch}/kubectl"
    sha256: "6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f"
    when: "params.version == '1.37.0'"
  # flannel 上游未发布 checksum 文件 —— 无摘要可钉,于是它在 plan 期
  # 无法内容寻址比对(verify 会如实报"说不清")。不编一个假的。
  - name: flannel-manifest
    file: "https://github.com/flannel-io/flannel/releases/download/v${params.flannel_ver}/kube-flannel.yml"

  # —— 人工维护的配置与 unit(沿用旧库 files/)——
  - { name: cfg-crictl,      file: files/crictl.yaml }
  - { name: cfg-containerd,  file: files/containerd-config.toml }
  - { name: unit-containerd, file: files/containerd.service }
  - { name: unit-kubelet,    file: files/kubelet.service }
  - { name: dropin-kubeadm,  file: files/10-kubeadm.conf }
  - { name: cfg-keepalived,  file: templates/keepalived.conf.j2 }
  - { name: cfg-haproxy,     file: templates/haproxy.cfg.j2 }
  - { name: cfg-nginx-api-lb,file: templates/nginx-k8s-api-lb.conf.j2 }
  - { name: cfg-api-hosts,   file: templates/k8s-api-hosts.j2 }

  # —— 镜像(全节点导入到 k8s.io)——
  - { name: img-apiserver,   image: "${params.image_repo}/kube-apiserver:v${params.version}" }
  - { name: img-cm,          image: "${params.image_repo}/kube-controller-manager:v${params.version}" }
  - { name: img-scheduler,   image: "${params.image_repo}/kube-scheduler:v${params.version}" }
  - { name: img-proxy,       image: "${params.image_repo}/kube-proxy:v${params.version}" }
  - { name: img-coredns,     image: "${params.image_repo}/coredns:v${params.coredns_ver}" }
  - { name: img-pause,       image: "${params.image_repo}/pause:${params.pause_ver}" }
  - { name: img-etcd,        image: "${params.image_repo}/etcd:${params.etcd_ver}" }
  - { name: img-flannel,     image: "ghcr.io/flannel-io/flannel:v${params.flannel_ver}" }
  - { name: img-flannel-cni, image: "ghcr.io/flannel-io/flannel-cni-plugin:v${params.flannel_cni_ver}" }

resources:
  # ========== 主机基线 ==========
  # kubeadm 用 OS hostname 作 node 名,所以主机名是**期望态**而不是一条命令。
  - hostname: "${substrate.name}"

  # 时区统一:只影响显示,但机群时区不一致会让"跨机对同一件事的日志"变成
  # 先做减法再看 —— 排查故障时这点摩擦格外贵。
  - timezone: "${params.timezone}"

  # 时钟同步必须排在 kubeadm **之前**,而且要 `wait: true`。
  # 理由不是洁癖:etcd 的 raft 仲裁与 kubeadm 签发的证书有效期都吃时钟偏差,
  # 拿着偏了几百毫秒的时钟去 init,失败会发生在很久以后且极难归因。
  # 实测未收敛的虚机节点间偏差可达 124ms(见 library/selftest)。
  - time_sync:
      servers: "${params.ntp_servers}"
      wait: true
  # 旧版是 `swapoff -a` + sed /etc/fstab 两步两个 check;类型化后连"重启后 swap
  # 自己回来"这个经典陷阱都在 plan 里看得见。
  - swap: { state: disabled, persist: true }
  - kernel_modules: { load: [overlay, br_netfilter], persist: true }
  - sysctl:
      set:
        net.bridge.bridge-nf-call-iptables: 1
        net.bridge.bridge-nf-call-ip6tables: 1
        net.ipv4.ip_forward: 1
  - package:
      packages:
        debian: [conntrack, socat, ipset, ethtool, ebtables]

  # ========== containerd 运行时 ==========
  - unarchive: { material: containerd, to: /usr/local, creates: /usr/local/bin/containerd }
  - copy:      { material: runc, dest: /usr/local/sbin/runc, mode: "0755" }
  - unarchive: { material: cni-plugins, to: /opt/cni/bin, creates: /opt/cni/bin/bridge }
  # CNI 配置目录必须先于 containerd 启动存在,否则它的 fsnotify watch 建不起来,
  # flannel 后写的配置不被加载、节点卡 NotReady(旧库 D-076 的根因)。
  - file:      { path: /etc/cni/net.d, state: directory }
  - unarchive: { material: crictl, to: /usr/local/bin, creates: /usr/local/bin/crictl }
  - copy:      { material: cfg-crictl, dest: /etc/crictl.yaml }
  - copy:      { material: cfg-containerd, dest: /etc/containerd/config.toml }
  - systemd_unit: { name: containerd, from_material: unit-containerd }
  # 上面任一项变了,这条自然要求重启 —— 旧版靠 `notify: [restart_containerd]` 手写。
  - service:   { name: containerd, state: started, enabled: true }

  # ========== kube 二进制 ==========
  - copy: { material: "${item}", dest: "/usr/local/bin/${item}", mode: "0755" }
    each: ["kubeadm", "kubelet", "kubectl"]
  - systemd_unit:
      name: kubelet
      from_material: unit-kubelet
      dropins: [dropin-kubeadm]
  # 只声明**开机自启**,不声明"正在运行"。
  #
  # kubelet 在 kubeadm 写出配置之前根本起不来 —— 此刻断言 `state: started`
  # 是一个在该时点**不可满足**的期望态,每次 apply 都会报一条"未达期望态"。
  # 让 plan 长期带着一条注定为红的项,代价是所有人开始忽略这类提示。
  #
  # kubelet 的"在跑"是**集群成员资格的后果**,不是一个独立的期望态:
  # 真正让它跑起来的是 bootstrap 那支舞里的 kubeadm。所以它归 cluster_member 管。
  - service: { name: kubelet, enabled: true }

  # flannel 清单要先落到目标机,bootstrap 那支舞才 apply 得了它。
  - copy: { material: flannel-manifest, dest: /etc/kubernetes/kube-flannel.yml }
    target: seed

  - image_present:
      materials: [img-apiserver, img-cm, img-scheduler, img-proxy, img-coredns,
                  img-pause, img-etcd, img-flannel, img-flannel-cni]
      namespace: k8s.io
    when: params.preload_images

  # ========== 控制面 LB ==========
  # 默认方案:每台 master 的 Nginx 监听自己的内网地址、把 8443 转给所有真实
  # apiserver。所有节点将同一个稳定 DNS 名解析为三台 master；不需要 VIP 或
  # 外部 DNS，kubeadm 仍能得到合法的 controlPlaneEndpoint。
  - template: { material: cfg-api-hosts, dest: /etc/kubernetes/crater-api.hosts }
    when: "params.ha && params.ha_mode == 'nginx-local'"
  - shell:
      cmd: >-
        sed -i '/^# crater-k8s-api begin$/,/^# crater-k8s-api end$/d' /etc/hosts &&
        cat /etc/kubernetes/crater-api.hosts >> /etc/hosts
      check: >-
        test -f /etc/kubernetes/crater-api.hosts &&
        test "$(sed -n '/^# crater-k8s-api begin$/,/^# crater-k8s-api end$/p' /etc/hosts)" =
        "$(cat /etc/kubernetes/crater-api.hosts)"
    when: "params.ha && params.ha_mode == 'nginx-local'"
  - package:
      packages:
        debian: [nginx, libnginx-mod-stream]
    target: masters
    when: "params.ha && params.ha_mode == 'nginx-local'"
  # Ubuntu 的 nginx.conf 在顶层 include modules-enabled/*.conf；50-mod-stream.conf
  # 先加载 stream 模块,本文件再声明 stream 块。不能放 conf.d——那里在 http 块内。
  - template: { material: cfg-nginx-api-lb, dest: /etc/nginx/modules-enabled/99-k8s-api-lb.conf }
    target: masters
    when: "params.ha && params.ha_mode == 'nginx-local'"
  - service: { name: nginx, state: started, enabled: true }
    target: masters
    when: "params.ha && params.ha_mode == 'nginx-local'"

  # 兼容旧方案:显式选择 ha_mode=vip 时才安装 Keepalived + HAProxy。
  - package:
      packages:
        debian: [keepalived, haproxy]
    target: masters
    when: "params.ha && params.ha_mode == 'vip'"
  - template: { material: cfg-haproxy, dest: /etc/haproxy/haproxy.cfg }
    target: masters
    when: "params.ha && params.ha_mode == 'vip'"
  - template: { material: cfg-keepalived, dest: /etc/keepalived/keepalived.conf }
    target: masters
    when: "params.ha && params.ha_mode == 'vip'"
  # 包安装时 haproxy 已带默认配置起来了,必须重启才加载我们写的 :8443 —— 上游
  # 配置变更会经指纹传播到这里,不必手写 notify。
  - service: { name: haproxy,    state: started, enabled: true }
    target: masters
    when: "params.ha && params.ha_mode == 'vip'"
  - service: { name: keepalived, state: started, enabled: true }
    target: masters
    when: "params.ha && params.ha_mode == 'vip'"

  # ========== 集群成员资格:状态在这里,舞在 procedure 里 ==========
  - cluster_member: { role: control-plane }
    target: masters
  - cluster_member: { role: worker }
    target: workers

types:
  # L2 数据模块层:引擎不必懂 kubeadm(D-017)。现实由只读探针读出,
  # 弥合动作是一支舞 —— 操作者面对的是"这台应当是集群成员"这个名词。
  - name: cluster_member
    args:
      role: { type: { enum: [control-plane, worker] } }
    observe:
      cmd: "test -f /etc/kubernetes/kubelet.conf && echo joined || echo absent"
      parse: { joined: joined }
    apply: bootstrap
    destroy: reset
    upgrade: upgrade

procedures:
  # ---- 建集群:首台 init → 传 token/certkey → 其余逐台 join ----
  bootstrap:
    steps:
      # 默认 Nginx 在每台控制面内网地址监听 8443；先确认本机代理在位,再让 kubeadm
      # 写入机群共享的稳定 DNS endpoint。单节点和兼容 VIP 路径都不需要此等待。
      - wait: { port: 8443, host: "${substrate.ip}", timeout: 30 }
        target: masters
        when: "params.ha && params.ha_mode == 'nginx-local'"

      # 条件 flag 的正规写法(D-117 §3.4):条件是**条目的属性**,不是字符串里的三元。
      # 单节点不传 --control-plane-endpoint。默认 HA 写稳定内部 DNS:它在所有节点
      # 都解析到三台 master 的 Nginx；兼容 VIP 才使用操作者给出的 endpoint。
      # flags[].name 禁插值 ⇒ lint 能静态枚举这条命令的全部 4 种展开形态。
      - cmd:
          argv: [kubeadm, init]
          creates: /etc/kubernetes/admin.conf
          flags:
            - name: --control-plane-endpoint
              value: "${params.api_endpoint}:8443"
              when: "params.ha && params.ha_mode == 'nginx-local'"
            - name: --control-plane-endpoint
              value: "${params.cp_endpoint}"
              when: "params.ha && params.ha_mode == 'vip' && params.cp_endpoint != ''"
            # 共享 DNS endpoint 必须进 apiserver 证书 SAN,否则经 Nginx 访问 API
            # 时 TLS 会拒绝该主机名。
            - name: --apiserver-cert-extra-sans
              value: "${params.api_endpoint}"
              when: "params.ha && params.ha_mode == 'nginx-local'"
            - name: --upload-certs
              when: params.ha
            - name: --pod-network-cidr
              value: "${params.pod_cidr}"
            - name: --image-repository
              value: "${params.image_repo}"
            - name: --kubernetes-version
              value: "v${params.version}"
            - name: --cri-socket
              value: "unix:///run/containerd/containerd.sock"
        target: seed
        exports:
          join:    "kubeadm token create --print-join-command"
          certkey: "kubeadm init phase upload-certs --upload-certs 2>/dev/null | tail -1"

      - shell:
          cmd: "mkdir -p /root/.kube && cp -f /etc/kubernetes/admin.conf /root/.kube/config"
          check: "test -f /root/.kube/config"
        target: seed

      - shell:
          cmd: "kubectl apply -f /etc/kubernetes/kube-flannel.yml"
          check: "kubectl -n kube-flannel get ds/kube-flannel-ds"
          env: { KUBECONFIG: /etc/kubernetes/admin.conf }
        target: seed

      # 其余 control-plane 逐台 join —— etcd learner 必须一个一个同步。
      # 旧版只能"全组跑 + check 守卫跳过首台",一行代码配三行注释。
      - shell:
          cmd: >-
            ${facts.join} --control-plane --certificate-key ${facts.certkey}
            --cri-socket=unix:///run/containerd/containerd.sock
          check: "test -f /etc/kubernetes/kubelet.conf"
        target: followers
        strategy: { throttle: 1 }

      - shell:
          cmd: "mkdir -p /root/.kube && cp -f /etc/kubernetes/admin.conf /root/.kube/config"
          check: "test -f /root/.kube/config"
        target: followers

      # worker 可并行 join
      - shell:
          cmd: "${facts.join} --cri-socket=unix:///run/containerd/containerd.sock"
          check: "test -f /etc/kubernetes/kubelet.conf"
        target: workers

      # 单节点必须去污点,否则工作负载没地方调度;多节点去掉也无妨(worker 在)。
      - shell:
          cmd: "kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true"
          check: "false"
          env: { KUBECONFIG: /etc/kubernetes/admin.conf }
        target: seed

  # ---- 退役:其余资源的 destroy 是推论,这里只留真正的过程知识 ----
  reset:
    steps:
      - shell:
          cmd: "kubeadm reset -f --cri-socket=unix:///run/containerd/containerd.sock || true"
          check: "! test -f /etc/kubernetes/kubelet.conf"
        target: all
      # kubeadm reset 与 stop containerd 都不会杀 shim 托管的容器(shim 保活),
      # 残留 apiserver/etcd 占着端口 → 下次 join 撞 "Port 6443 in use"。
      # 这类坑正是专家知识,值得封装进 blueprint 而不是让每个用户各踩一遍。
      - shell:
          cmd: >-
            crictl --runtime-endpoint unix:///run/containerd/containerd.sock rm -f
            $(crictl --runtime-endpoint unix:///run/containerd/containerd.sock ps -aq 2>/dev/null) 2>/dev/null;
            pkill -9 containerd-shim 2>/dev/null; true
          check: "! pgrep containerd-shim"
        target: all
      # 判据要覆盖**这一步删的全部路径**,不能只挑一个。
      #
      # 原先写的是 `! test -d /var/lib/etcd` —— 而 worker 上从来就没有 etcd,
      # 条件天然成立,于是 rm 在 worker 上**一次都没跑过**:真机销毁后
      # /etc/kubernetes 与 /var/lib/kubelet 原样留在两台 worker 上。
      # 这与升级那次是同一个毛病:check 检验了一个与本步效果无关的东西。
      - shell:
          cmd: "rm -rf /etc/kubernetes /var/lib/kubelet /var/lib/etcd /root/.kube"
          check: >-
            ! test -e /etc/kubernetes && ! test -e /var/lib/kubelet
            && ! test -e /var/lib/etcd && ! test -e /root/.kube
        target: all

  # ---- 滚动升级 ----
  # `crater procedure upgrade -f k8s-ha.blueprint.yaml --set version=1.37.0 --closure <含两版的闭包>`
  #
  # 参数就叫 `version`,不叫 `to` —— 因为它必须**驱动物料变体的选择**:
  # 叫 `to` 的话 `params.version` 仍是蓝图默认值,物料会解析成旧版二进制,
  # 于是"用 1.36.1 的 kubeadm 去 upgrade apply v1.37.0",必然失败。
  # 过程参数在本支舞的作用域里覆盖蓝图参数,所以同名正是想要的效果。
  upgrade:
    params:
      version: { type: version, required: true }
    steps:
      - copy: { material: kubeadm, dest: /usr/local/bin/kubeadm, mode: "0755" }
        target: all
      - shell:
          cmd: "kubectl drain ${substrate.name} --ignore-daemonsets --delete-emptydir-data --timeout=300s || true"
          check: "false"
          env: { KUBECONFIG: /etc/kubernetes/admin.conf }
        target: masters
        strategy: { throttle: 1 }
      # ── check 必须检验**本步自己的效果** ──────────────────────────
      #
      # 这里踩过一个静默的坑:原先三步的 check 都写
      # `kubeadm version -o short | grep -q v${params.version}`。而第一步刚把
      # 新版 kubeadm 二进制 copy 到所有机器 —— 于是这个条件当场成立,
      # 三步全部被判为"已完成"跳过,报告显示 ok,而集群一点没升。
      #
      # 教训是通用的:**check 不能检验一个由前序步骤建立的前提**,
      # 它只能检验这一步做完之后才为真的东西。前提该由 `deps` 或步骤顺序表达。
      - shell:
          # 集群声明的版本 —— 只有 `upgrade apply` 成功才会改写它。
          cmd: "kubeadm upgrade apply -y v${params.version}"
          check: >-
            kubectl -n kube-system get cm kubeadm-config
            -o jsonpath='{.data.ClusterConfiguration}'
            | grep -q 'kubernetesVersion: v${params.version}'
          env: { KUBECONFIG: /etc/kubernetes/admin.conf }
        target: seed
      - shell:
          # 其余控制面:静态 Pod 清单里的镜像标签,只有 `upgrade node` 会改它。
          cmd: "kubeadm upgrade node"
          check: "grep -q 'kube-apiserver:v${params.version}' /etc/kubernetes/manifests/kube-apiserver.yaml"
          env: { KUBECONFIG: /etc/kubernetes/admin.conf }
        target: followers
        strategy: { throttle: 1 }
      - shell:
          # worker 没有静态 Pod,`upgrade node` 只是把 kubelet 配置从集群同步下来,
          # 没有版本化的落点可查。它**本身幂等**,所以每次都跑是正确且廉价的 ——
          # 与其编一个查不准的 check,不如老实承认没有。
          cmd: "kubeadm upgrade node"
          check: "false"
        target: workers
        strategy: { throttle: 1 }

      - copy: { material: "${item}", dest: "/usr/local/bin/${item}", mode: "0755" }
        each: ["kubelet", "kubectl"]
        target: all
      - service: { name: kubelet, state: restarted }
        target: all
        strategy: { throttle: 1 }
      # 解除封锁 —— 判据是**节点真的可调度了**,不是"命令跑过了"。
      #
      # 原先写的是 `kubectl uncordon … || true` 配 `check: "false"`:
      # `|| true` 吞掉失败,check 恒不满足又意味着永不校验,于是这一步无论成没成
      # 都报 changed。实测里 kubelet 刚重启、apiserver 短暂不可用,uncordon 静默
      # 失败,cp2 就一直封锁着 —— 而报告显示一切正常。
      #
      # 现在 check 直接问集群"这个节点还封锁着吗",失败会被看见。
      - shell:
          cmd: "kubectl uncordon ${substrate.name}"
          check: >-
            test "$(kubectl get node ${substrate.name}
            -o jsonpath='{.spec.unschedulable}' 2>/dev/null)" != "true"
          env: { KUBECONFIG: /etc/kubernetes/admin.conf }
        target: masters
        # kubelet 刚重启,apiserver 可能还在恢复 —— 重试几次比失败更合理。
        strategy: { retries: 3 }

health:
  - service_active: kubelet
  - service_active: containerd
  - cmd:
      run: "kubectl get nodes -o wide"
      env: { KUBECONFIG: /etc/kubernetes/admin.conf }
    target: seed
