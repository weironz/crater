# MinIO 分布式对象存储 —— 四节点对等。
#
# 拓扑形状与前两份都不同:没有主从、没有仲裁选举,**每台都必须知道全体**
# (启动参数里要列出所有节点的 URL)。这类"全体交叉引用"的配置在 shell 里
# 是最难维护的一种 —— 加一台机器要改所有机器的启动参数。
# 这里它是 `fleet.storage` 上的一次循环。
name: minio-cluster
version: "1"
description: MinIO 四节点分布式(纠删码),数据盘独立挂载

fleet:
  groups:
    storage: {min: 4}

cast:
  all_store: role.storage
  seed:      first(role.storage)

params:
  version:    { default: "RELEASE.2025-04-22T22-12-26Z", stage: build }
  data_dir:   { default: "/srv/miniodata" }
  disk_img:   { default: "/var/lib/miniodisk.img" }
  disk_mb:    { type: int, default: 512 }
  api_port:   { type: port, default: 9000 }
  con_port:   { type: port, default: 9001 }
  root_user:  { default: "minioadmin" }
  root_pass:  { default: "minioadmin2026" }

materials:
  - name: minio
    file: "https://dl.min.io/server/minio/release/linux-${substrate.arch}/archive/minio.${params.version}"
  - { name: minio-unit, file: files/minio.service }
  - { name: minio-env,  file: templates/minio.env.j2 }

resources:
  # ---- 数据盘 ----
  - shell:
      cmd: "truncate -s ${params.disk_mb}M ${params.disk_img} && mkfs.ext4 -q -F ${params.disk_img}"
      creates: "${params.disk_img}"
    target: all_store
  - mount:
      path: "${params.data_dir}"
      src: "${params.disk_img}"
      fstype: ext4
      opts: "loop,noatime"
      persist: true
    target: all_store
  - file: { path: "${params.data_dir}", state: directory, owner: appsvc, group: appsvc, mode: "0750" }
    target: all_store

  # ---- 二进制与配置 ----
  - copy: { material: minio, dest: /usr/local/bin/minio, mode: "0755" }
    target: all_store
  # 环境文件由**机群视角**渲染:MINIO_VOLUMES 要列出全体节点的 URL。
  - template: { material: minio-env, dest: /etc/default/minio, owner: root, group: appsvc, mode: "0640" }
    target: all_store
  - systemd_unit: { name: minio, from_material: minio-unit }
    target: all_store
  - service: { name: minio, state: started, enabled: true }
    target: all_store

health:
  # MinIO 自带 /minio/health/live —— 这正是 http 探针该用的地方:
  # 端口通只说明进程在,健康端点通才说明它认为自己可服务。
  - http: { url: "http://127.0.0.1:${params.api_port}/minio/health/live", status: 200 }
    target: all_store
  - port_open: { port: "${params.con_port}" }
    target: all_store
