# yq —— 自包含单文件模板(inventory + task 一体)。
# 用法:crater apply -f library/apps/yq.yaml -i <你的 inventory>     # 推荐
#       crater apply -f library/apps/yq.yaml                          # 用下方内嵌 inventory
# crater build 会自动剥掉 inventory(凭据不进 OCI)。

name: yq
description: "安装 yq(自包含示例:inventory + task)"
hosts: all                      # all / 组名 / 主机名

params:                         # 输入契约(crater inspect 可见)
  version:
    description: "yq 版本"
    default: "4.44.3"
    stage: build

materials:
  - name: yq-bin
    kind: file
    url_tmpl: "https://github.com/mikefarah/yq/releases/download/v{{version}}/yq_linux_amd64"

actions:
  - id: install
    action: place
    material: yq-bin
    dest: /usr/local/bin/yq
    mode: "0755"
    check: "test -x /usr/local/bin/yq"

inventory:                      # 内嵌示范(占位密码):改成你的机器,或删掉改用 -i
  hosts:
    - { name: node1, address: 192.168.1.11, user: root, password: "changeme" }
