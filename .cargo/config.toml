# Build-speed config (D-079). The dominant dev-build cost on this 2-core box is
# codegen + link; mold is a much faster linker than the default bfd/gold.
#
# Prereq (Debian/Ubuntu): apt-get install -y mold
# Without it the default glibc build fails with:
#   error: linker `cc` ... cannot find -fuse-ld=mold
# To build without mold, comment out the rustflags line below.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
