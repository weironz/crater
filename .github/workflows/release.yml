name: release

# 打 tag 即发版;也可手工触发(需给出已存在的 tag)。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag(须已存在,如 v0.1.1)"
        required: true

env:
  # 两件事一起做:
  # 1. 覆盖仓库 .cargo/config.toml 的 -fuse-ld=mold(D-079 本地提速)——
  #    runner 上没有 mold,不覆盖直接链接失败。
  #    RUSTFLAGS 环境变量的优先级高于 config.toml 的 target.*.rustflags。
  # 2. **零警告门禁**。cargo 对 registry 依赖自动 --cap-lints allow,
  #    所以这条只管得住本仓库的 crate,不会被上游的警告误伤。
  #    在此之前"零警告"全靠人肉 grep 声称,而 grep 写窄了就会漏
  #    (`does not need to be mutable` 就这么溜过去过)。
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always

jobs:
  # ── 发版前先跑测试 ──
  # 发一个没跑过测试的版本,等于把验证成本推给下游。
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked

  # ── 各架构原生构建,目标是 musl 静态 ──
  #
  # **原生**:aws-lc-sys(rustls 的后端)要 C 工具链,QEMU 里编 arm64 是几十
  # 分钟起步;公共仓库有免费 arm runner,各编各的最省事。
  #
  # **musl 静态**:产物 static-pie、零动态依赖 —— 下载即用,不看目标机的
  # glibc 脸色,镜像也能落在 alpine 上(159MB → 44MB)。
  # 它需要 musl-tools 提供的 x86_64-linux-musl-gcc(aws-lc-sys 点名要它)。
  # 静态 musl 的经典疑点是 DNS,已实测:容器内拉 https 物料正常。
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 = glibc 2.35 基线,比 24.04 覆盖更广的发行版。
          - runner: ubuntu-22.04
            arch: amd64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-22.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 装 musl 工具链
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 构建
        run: cargo build --release --locked --target ${{ matrix.target }} -p crater-cli

      - name: 自检(装出来的东西真能跑,且真的是静态的)
        run: |
          BIN=target/${{ matrix.target }}/release/crater
          $BIN --version
          $BIN types >/dev/null
          # 静态是这次改动的全部意义 —— 退回动态链接要当场红,而不是
          # 等到有人把它拷到别的机器上才发现跑不起来。
          #
          # 两种措辞都算数:x86_64 出的是 `static-pie linked`,aarch64 出的是
          # `statically linked`(非 PIE)。只认前一种会把好好的 arm 产物判成失败。
          # 真正要拒的是动态链接,直接证据是**有没有 INTERP 段**。
          file "$BIN"
          if readelf -l "$BIN" | grep -q INTERP; then
            echo "::error::不是静态链接(存在 INTERP 段,依赖动态链接器)"; exit 1
          fi

      - name: 打包
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/crater dist/crater-${{ matrix.arch }}
          strip dist/crater-${{ matrix.arch }} || true
          # 解包出来就叫 crater,不带架构后缀 —— 下载的人不该再改名。
          tar -czf crater-${{ matrix.target }}.tar.gz \
            --transform 's|^crater-${{ matrix.arch }}$|crater|' \
            -C dist crater-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: crater-${{ matrix.arch }}
          path: |
            dist/crater-${{ matrix.arch }}
            crater-${{ matrix.target }}.tar.gz
          retention-days: 7

  # ── GitHub Release ──
  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write        # gh release 需要写权限
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 取版本号并与 Cargo.toml 对账
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # tag 与 Cargo.toml 版本不一致,是最难在事后追查的一类发布事故:
          # 二进制自报 0.1.0,而 release 页面写着 0.2.0。宁可现在红。
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$CARGO_VER" != "${TAG#v}" ]; then
            echo "::error::tag $TAG 与 Cargo.toml 的 version=$CARGO_VER 不一致 —— 先改 Cargo.toml 再打 tag"
            exit 1
          fi

      - name: 汇总产物与摘要
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          cd release
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # release 可能已存在(重跑、或先发了镜像):存在就补传,不存在才创建。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" \
              --title "crater $TAG" \
              --generate-notes \
              --verify-tag \
              release/*
          fi

  # ── 容器镜像:Docker Hub + 阿里云 ACR ──
  # 复用上面构建好的二进制,镜像里只做 COPY —— 不在 QEMU 里编译 Rust。
  image:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 算出版本号与 ACR 的主机名 / 仓库前缀
        id: meta
        env:
          ACR_URL: ${{ secrets.ACR_URL }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # ACR_URL 形如 registry.cn-shenzhen.aliyuncs.com/<命名空间>:
          # 登录只认**主机名**,而镜像 tag 要带上命名空间。两者必须分开取,
          # 把整个 URL 当 registry 传给 login 会认证到一个不存在的地址。
          echo "acr_host=${ACR_URL%%/*}" >> "$GITHUB_OUTPUT"
          echo "acr_repo=${ACR_URL}/crater" >> "$GITHUB_OUTPUT"

      - name: 摆好二进制(Dockerfile 按 TARGETARCH 取用)
        run: |
          mkdir -p dist
          cp artifacts/crater-amd64/dist/crater-amd64 dist/
          cp artifacts/crater-arm64/dist/crater-arm64 dist/
          chmod +x dist/crater-*
          ls -l dist/

      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.meta.outputs.acr_host }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送(amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 关掉 buildx 默认附带的 provenance / SBOM 证明。
          #
          # 它们会往 manifest list 里塞一个 application/vnd.oci.empty.v1+json
          # 的空描述符,而阿里云 ACR 不认这个类型,推送直接
          # `denied: unknown manifest class`。Docker Hub 认,ACR 不认 ——
          # 要同时推两个仓,就得按最保守的那个来。
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crater:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/crater:latest
            ${{ steps.meta.outputs.acr_repo }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.acr_repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 部署到生产机(traefik 前置)──
  # CI 只做一件事:把版本号推上去并重启。域名、token、机群凭据都由运维
  # **一次性**放在服务器的 /data/crater/.env 与 workspace/ 里 ——
  # 让 CI 去生成 token,等于把凭据写进一个没人会去读的日志。
  deploy:
    needs: image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 取版本号
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 备好 SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 首连就把主机公钥钉下来 —— 用 StrictHostKeyChecking=no 等于放弃
          # 中间人防护,而这条链路一头是生产机。
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 同步编排文件
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yaml \
            root@${{ secrets.DEPLOY_HOST }}:/data/crater/docker-compose.yaml

      - name: 换版本并重启
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} bash -euo pipefail <<'EOSSH'
            cd /data/crater
            test -f .env || { echo "缺 /data/crater/.env(域名与 token 在里面)"; exit 1; }
            # 只改 CRATER_VERSION 这一行,其余(域名、token)一个字节不碰。
            if grep -q '^CRATER_VERSION=' .env; then
              sed -i "s|^CRATER_VERSION=.*|CRATER_VERSION=${{ steps.ver.outputs.version }}|" .env
            else
              echo "CRATER_VERSION=${{ steps.ver.outputs.version }}" >> .env
            fi
            docker compose pull
            docker compose up -d
            docker compose ps
          EOSSH

      - name: 探活
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} '
            for i in $(seq 1 20); do
              v=$(docker exec crater /usr/local/bin/crater --version 2>/dev/null) && { echo "容器内版本:$v"; exit 0; }
              sleep 3
            done
            echo "起不来 —— 最近日志:"; docker logs --tail 40 crater; exit 1'
