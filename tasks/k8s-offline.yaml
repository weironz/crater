# Kubernetes 单节点 —— **全 material 离线形态**(D-063 / D-066)。
#
# 依赖全部声明为 materials,`crater build` 打进 OCI,目标机零联网即可起。material 的
# `kind` 表示「怎么获取内容」(D-065):
#   file(url)       —— containerd/runc/cni/crictl/kubeadm/kubelet/kubectl 静态二进制;
#                      flannel 清单(从官方 release 下载)
#   file(src)       —— 官方不提供、需人工维护的文件:systemd unit / drop-in / 配置
#                      (放在同级 files/,build 读本地、place 原样推送,copy 语义,不渲染)
#   image           —— 控制面 7 镜像(CN 镜像源)+ flannel 2 镜像;build pull 进包、apply ctr import 到 k8s.io
#   os_package      —— conntrack/socat/ipset/ethtool(buildah 在 ubuntu:24.04 解闭包打 .deb)
# 目标:ubuntu 24.04 / amd64。kubeadm init 用 image-repository 同 CN 源 → 预载不拉。
# task.yaml 不再内联任何文件内容 —— 一切要么 url 下载、要么 files/ 维护(无 YAML 爆炸)。
name: k8s-offline
hosts: all

vars:
  version: "1.36.1"            # 最新稳定 k8s(kubeadm/kubelet/kubectl,也是 image tag)
  containerd_ver: "2.3.1"      # containerd 2.x(config schema v4,见 files/containerd-config.toml)
  runc_ver: "1.4.2"
  cni_ver: "1.9.1"
  crictl_ver: "1.36.0"
  coredns_ver: "1.14.2"
  etcd_ver: "3.6.8-0"
  pause_ver: "3.10.2"
  flannel_ver: "0.28.4"
  flannel_cni_ver: "1.9.1-flannel1"
  pod_cidr: "10.244.0.0/16"    # 与官方 kube-flannel.yml 的 net-conf.json 默认一致
  image_repo: "registry.aliyuncs.com/google_containers"

# {{arch}} 在渲染 material url 时自动绑定该 material 的 arch 字段(D-064),单一来源。
materials:
  # —— 二进制(file/url,按 arch 选变体)——
  - name: containerd
    kind: file
    arch: amd64
    url_tmpl: "https://github.com/containerd/containerd/releases/download/v{{containerd_ver}}/containerd-{{containerd_ver}}-linux-{{arch}}.tar.gz"
  - name: runc
    kind: file
    arch: amd64
    url_tmpl: "https://github.com/opencontainers/runc/releases/download/v{{runc_ver}}/runc.{{arch}}"
  - name: cni-plugins
    kind: file
    arch: amd64
    url_tmpl: "https://github.com/containernetworking/plugins/releases/download/v{{cni_ver}}/cni-plugins-linux-{{arch}}-v{{cni_ver}}.tgz"
  - name: crictl
    kind: file
    arch: amd64
    url_tmpl: "https://github.com/kubernetes-sigs/cri-tools/releases/download/v{{crictl_ver}}/crictl-v{{crictl_ver}}-linux-{{arch}}.tar.gz"
  - name: kubeadm
    kind: file
    arch: amd64
    url_tmpl: "https://dl.k8s.io/release/v{{version}}/bin/linux/{{arch}}/kubeadm"
  - name: kubelet
    kind: file
    arch: amd64
    url_tmpl: "https://dl.k8s.io/release/v{{version}}/bin/linux/{{arch}}/kubelet"
  - name: kubectl
    kind: file
    arch: amd64
    url_tmpl: "https://dl.k8s.io/release/v{{version}}/bin/linux/{{arch}}/kubectl"

  # —— flannel 清单:官方 release 下载(file/url),其引用镜像见下方 image material ——
  - name: flannel-manifest
    kind: file
    url_tmpl: "https://github.com/flannel-io/flannel/releases/download/v{{flannel_ver}}/kube-flannel.yml"

  # —— 人工维护的本地文件(file/src):官方不提供,放在 files/ ——
  - name: cfg-modules
    kind: file
    src: files/modules-k8s.conf
  - name: cfg-sysctl
    kind: file
    src: files/sysctl-k8s.conf
  - name: cfg-crictl
    kind: file
    src: files/crictl.yaml
  - name: cfg-containerd
    kind: file
    src: files/containerd-config.toml
  - name: unit-containerd
    kind: file
    src: files/containerd.service
  - name: unit-kubelet
    kind: file
    src: files/kubelet.service
  - name: dropin-kubeadm
    kind: file
    src: files/10-kubeadm.conf

  # —— OS 包闭包(os_package,buildah)——
  - name: sysdeps
    kind: os_package
    base: "ubuntu:24.04"
    arch: amd64
    packages:
      debian: [conntrack, socat, ipset, ethtool, ebtables]

  # —— 容器镜像(image,build pull 进包、apply import 到 k8s.io)——
  - name: img-apiserver
    kind: image
    ref: "registry.aliyuncs.com/google_containers/kube-apiserver:v{{version}}"
  - name: img-cm
    kind: image
    ref: "registry.aliyuncs.com/google_containers/kube-controller-manager:v{{version}}"
  - name: img-scheduler
    kind: image
    ref: "registry.aliyuncs.com/google_containers/kube-scheduler:v{{version}}"
  - name: img-proxy
    kind: image
    ref: "registry.aliyuncs.com/google_containers/kube-proxy:v{{version}}"
  - name: img-coredns
    kind: image
    ref: "registry.aliyuncs.com/google_containers/coredns:v{{coredns_ver}}"
  - name: img-pause
    kind: image
    ref: "registry.aliyuncs.com/google_containers/pause:{{pause_ver}}"
  - name: img-etcd
    kind: image
    ref: "registry.aliyuncs.com/google_containers/etcd:{{etcd_ver}}"
  - name: img-flannel
    kind: image
    ref: "ghcr.io/flannel-io/flannel:v{{flannel_ver}}"
  - name: img-flannel-cni
    kind: image
    ref: "ghcr.io/flannel-io/flannel-cni-plugin:v{{flannel_cni_ver}}"

actions:
  # —— 内核/系统前置 ——
  - id: swapoff
    action: shell
    cmd: "swapoff -a"
    check: "test -z \"$(swapon --show)\""
  - id: swap_fstab
    action: shell
    needs: [swapoff]
    cmd: "sed -ri '/\\sswap\\s/s/^([^#])/#\\1/' /etc/fstab"
    check: "! grep -Eq '^[^#].*\\sswap\\s' /etc/fstab"
  - id: modules_conf
    action: place
    material: cfg-modules
    dest: /etc/modules-load.d/k8s.conf
  - id: modprobe
    action: shell
    needs: [modules_conf]
    cmd: "modprobe overlay && modprobe br_netfilter"
    check: "lsmod | grep -q br_netfilter"
  - id: sysctl_conf
    action: place
    material: cfg-sysctl
    dest: /etc/sysctl.d/k8s.conf
  - id: sysctl_apply
    action: shell
    needs: [sysctl_conf, modprobe]
    cmd: "sysctl --system"
    check: "test \"$(sysctl -n net.ipv4.ip_forward)\" = 1"

  # —— 依赖包(离线闭包)——
  - id: deps
    action: package
    material: sysdeps
    needs: [sysctl_apply]

  # —— containerd / runc / cni / crictl(unarchive 直接吃 material,取+解压一步,D-073)——
  - id: ctd_extract
    action: unarchive
    material: containerd
    to: /usr/local
    creates: /usr/local/bin/containerd
    needs: [deps]
  - id: runc
    action: place
    material: runc
    dest: /usr/local/sbin/runc
    mode: "0755"
    needs: [deps]
  - id: cni_extract
    action: unarchive
    material: cni-plugins
    to: /opt/cni/bin
    creates: /opt/cni/bin/bridge
    needs: [deps]
  # CNI 配置目录须在 containerd 启动前存在(否则 fsnotify watch 建不起来,D-076)。
  - id: cni_confdir
    action: file
    path: /etc/cni/net.d
    state: directory
  - id: crictl_extract
    action: unarchive
    material: crictl
    to: /usr/local/bin
    creates: /usr/local/bin/crictl
    needs: [deps]
  - id: crictl_cfg
    action: place
    material: cfg-crictl
    dest: /etc/crictl.yaml

  - id: ctd_cfg
    action: place
    material: cfg-containerd
    dest: /etc/containerd/config.toml
    needs: [ctd_extract]
    notify: [restart_containerd]
  - id: ctd_unit
    action: place
    material: unit-containerd
    dest: /etc/systemd/system/containerd.service
    needs: [ctd_extract]
  - id: svc_ctd
    action: service
    name: containerd
    state: started
    enabled: true
    needs: [ctd_cfg, ctd_unit, runc, cni_confdir]

  # —— kubeadm / kubelet / kubectl ——
  - id: kubeadm
    action: place
    material: kubeadm
    dest: /usr/local/bin/kubeadm
    mode: "0755"
    needs: [deps]
  - id: kubelet_bin
    action: place
    material: kubelet
    dest: /usr/local/bin/kubelet
    mode: "0755"
    needs: [deps]
  - id: kubectl
    action: place
    material: kubectl
    dest: /usr/local/bin/kubectl
    mode: "0755"
    needs: [deps]
  - id: kubelet_unit
    action: place
    material: unit-kubelet
    dest: /etc/systemd/system/kubelet.service
    needs: [kubelet_bin]
  - id: kubelet_dropin
    action: place
    material: dropin-kubeadm
    dest: /etc/systemd/system/kubelet.service.d/10-kubeadm.conf
    needs: [kubelet_unit]
  - id: svc_kubelet
    action: service
    name: kubelet
    state: started
    enabled: true
    needs: [kubelet_dropin, svc_ctd]

  # —— 离线导入镜像到 k8s.io(一步导入全部,kubeadm init 不再联网拉,D-074)——
  - id: load_images
    action: load_image
    materials: [img-apiserver, img-cm, img-scheduler, img-proxy, img-coredns, img-pause, img-etcd, img-flannel, img-flannel-cni]
    namespace: "k8s.io"
    needs: [svc_ctd]

  # —— 起集群 ——
  - id: kubeadm_init
    action: shell
    needs: [svc_kubelet, kubeadm, load_images]
    cmd: "kubeadm init --pod-network-cidr={{pod_cidr}} --image-repository {{image_repo}} --kubernetes-version v{{version}} --cri-socket=unix:///run/containerd/containerd.sock"
    check: "test -f /etc/kubernetes/admin.conf"
  - id: kubeconfig
    action: shell
    needs: [kubeadm_init]
    cmd: "mkdir -p /root/.kube && cp -f /etc/kubernetes/admin.conf /root/.kube/config"
    check: "test -f /root/.kube/config"

  # —— CNI(flannel,官方清单)——
  - id: flannel_manifest
    action: place
    material: flannel-manifest
    dest: /etc/kubernetes/kube-flannel.yml
    needs: [kubeconfig]
  - id: cni
    action: shell
    needs: [flannel_manifest]
    cmd: "KUBECONFIG=/etc/kubernetes/admin.conf kubectl apply -f /etc/kubernetes/kube-flannel.yml"
    check: "KUBECONFIG=/etc/kubernetes/admin.conf kubectl -n kube-flannel get ds/kube-flannel-ds"
  - id: untaint
    action: shell
    needs: [cni]
    cmd: "KUBECONFIG=/etc/kubernetes/admin.conf kubectl taint nodes --all node-role.kubernetes.io/control-plane- 2>/dev/null || true"
  - id: verify
    action: shell
    phase: verify
    needs: [untaint]
    cmd: "KUBECONFIG=/etc/kubernetes/admin.conf kubectl get nodes -o wide"

handlers:
  - id: restart_containerd
    action: service
    name: containerd
    state: restarted

# teardown = install 的完整反向:reset 运行态 → 停/禁服务 → 删数据/配置/二进制 → purge 包。
teardown:
  - id: reset
    action: shell
    cmd: "kubeadm reset -f --cri-socket=unix:///run/containerd/containerd.sock || true"
  - id: stop_kubelet
    action: service
    name: kubelet
    state: stopped
    enabled: false
    needs: [reset]
  - id: stop_containerd
    action: service
    name: containerd
    state: stopped
    enabled: false
    needs: [reset, stop_kubelet]
  - id: rm_dirs
    action: shell
    needs: [stop_containerd]
    cmd: "rm -rf /etc/kubernetes /var/lib/kubelet /var/lib/etcd /var/lib/containerd /etc/cni/net.d /root/.kube /etc/containerd"
  - id: rm_bins
    action: shell
    needs: [stop_containerd]
    cmd: "rm -f /usr/local/bin/kubeadm /usr/local/bin/kubelet /usr/local/bin/kubectl /usr/local/bin/crictl /usr/local/bin/containerd /usr/local/bin/containerd-shim-runc-v2 /usr/local/bin/ctr /usr/local/bin/containerd-stress /usr/local/sbin/runc; rm -rf /opt/cni/bin"
  - id: rm_units
    action: shell
    needs: [stop_containerd]
    cmd: "rm -f /etc/systemd/system/containerd.service /etc/systemd/system/kubelet.service /etc/crictl.yaml /etc/modules-load.d/k8s.conf /etc/sysctl.d/k8s.conf; rm -rf /etc/systemd/system/kubelet.service.d"
  - id: purge_sysdeps
    action: shell
    needs: [reset]
    cmd: "DEBIAN_FRONTEND=noninteractive apt-get purge -y conntrack socat ipset ethtool ebtables 2>/dev/null || true"
  - id: reload
    action: shell
    needs: [rm_units, rm_bins, rm_dirs]
    cmd: "systemctl daemon-reload"
