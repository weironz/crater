# Kubernetes 单节点(control-plane,kubeadm) —— 真·硬核 task。
#
# 范围与诚实声明:
#  - **单节点**:一台 control-plane,去掉污点让它也能调度 Pod。多节点(worker
#    join)crater 暂不支持——action 没有 when_role,无法在同一 task 里让 init 只在
#    control、join 只在 worker(见 docs/decisions.md 关于 when_role 的提案)。
#  - **在线**:用发行版包(containerd)+ pkgs.k8s.io apt 源(kubeadm/kubelet/kubectl)+
#    在线拉镜像。离线 k8s 需要 kind:image / os_package 接线(D-034 待做)。
#  - **CN 友好**:kubeadm 用 image-repository 镜像源拉控制面镜像;containerd
#    sandbox_image 同步改成镜像源 pause。
#
# 适用:Debian/Ubuntu 系(apt)。RHEL 系的源/包名不同,未覆盖。
name: k8s
hosts: all
vars:
  version: "1.31"                                   # pkgs.k8s.io 渠道(v1.31)
  pod_cidr: "10.244.0.0/16"                           # flannel 默认网段
  image_repo: "registry.aliyuncs.com/google_containers"  # 控制面镜像 CN 源
  pause_image: "registry.aliyuncs.com/google_containers/pause:3.10"
actions:
  # ---- 前置:关闭 swap(kubelet 要求)----
  - { id: swapoff, action: run_cmd, cmd: "swapoff -a",
      check: "test -z \"$(swapon --show)\"" }
  - { id: swap_fstab, action: run_cmd, needs: [swapoff],
      cmd: "sed -ri '/\\sswap\\s/s/^([^#])/#\\1/' /etc/fstab",
      check: "! grep -Eq '^[^#].*\\sswap\\s' /etc/fstab" }

  # ---- 内核模块:overlay + br_netfilter ----
  - { id: modules_conf, action: write_file, dst: /etc/modules-load.d/k8s.conf,
      content: "overlay\nbr_netfilter\n" }
  - { id: modprobe, action: run_cmd, needs: [modules_conf],
      cmd: "modprobe overlay && modprobe br_netfilter",
      check: "lsmod | grep -q br_netfilter" }

  # ---- sysctl:桥接流量走 iptables + 开启转发 ----
  - { id: sysctl_conf, action: write_file, dst: /etc/sysctl.d/k8s.conf,
      content: "net.bridge.bridge-nf-call-iptables  = 1\nnet.bridge.bridge-nf-call-ip6tables = 1\nnet.ipv4.ip_forward                 = 1\n" }
  - { id: sysctl_apply, action: run_cmd, needs: [sysctl_conf, modprobe],
      cmd: "sysctl --system",
      check: "test \"$(sysctl -n net.ipv4.ip_forward)\" = 1" }

  # ---- 容器运行时:containerd + SystemdCgroup + CN pause ----
  - { id: containerd, action: pkg_install, needs: [sysctl_apply],
      packages: { debian: [containerd] } }
  - { id: containerd_cfg, action: run_cmd, needs: [containerd], notify: [restart_containerd],
      cmd: "mkdir -p /etc/containerd && containerd config default > /etc/containerd/config.toml && sed -ri 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml && sed -ri 's#sandbox_image = .*#sandbox_image = \"{{pause_image}}\"#' /etc/containerd/config.toml",
      check: "grep -q 'SystemdCgroup = true' /etc/containerd/config.toml" }
  - { id: svc_containerd, action: service, name: containerd, state: started, enabled: true, needs: [containerd_cfg] }

  # ---- k8s apt 源 + kubeadm/kubelet/kubectl ----
  - { id: keyring_dir, action: file, path: /etc/apt/keyrings, state: directory, needs: [svc_containerd] }
  - { id: k8s_key, action: run_cmd, needs: [keyring_dir],
      cmd: "curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{version}}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg",
      check: "test -s /etc/apt/keyrings/kubernetes-apt-keyring.gpg" }
  - { id: k8s_repo, action: write_file, needs: [k8s_key],
      dst: /etc/apt/sources.list.d/kubernetes.list,
      content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{version}}/deb/ /\n" }
  # conntrack/socat/ethtool 是 kubeadm preflight 必需(精简系统常缺)。
  - { id: kube_pkgs, action: pkg_install, needs: [k8s_repo],
      packages: { debian: [kubelet, kubeadm, kubectl, conntrack, socat, ethtool] } }
  - { id: svc_kubelet, action: service, name: kubelet, state: started, enabled: true, needs: [kube_pkgs] }

  # ---- kubeadm init(幂等:已生成 admin.conf 则跳过)----
  - { id: kubeadm_init, action: run_cmd, needs: [svc_kubelet],
      cmd: "kubeadm init --pod-network-cidr={{pod_cidr}} --image-repository {{image_repo}} --cri-socket=unix:///run/containerd/containerd.sock",
      check: "test -f /etc/kubernetes/admin.conf" }
  - { id: kubeconfig, action: run_cmd, needs: [kubeadm_init],
      cmd: "mkdir -p /root/.kube && cp -f /etc/kubernetes/admin.conf /root/.kube/config",
      check: "test -f /root/.kube/config" }

  # ---- CNI:flannel(pod 网络)----
  - { id: cni, action: run_cmd, needs: [kubeconfig],
      cmd: "KUBECONFIG=/etc/kubernetes/admin.conf kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml",
      check: "KUBECONFIG=/etc/kubernetes/admin.conf kubectl -n kube-flannel get ds/kube-flannel-ds" }

  # ---- 单节点:去掉 control-plane 污点,允许调度业务 Pod ----
  - { id: untaint, action: run_cmd, needs: [cni],
      cmd: "KUBECONFIG=/etc/kubernetes/admin.conf kubectl taint nodes --all node-role.kubernetes.io/control-plane- 2>/dev/null || true" }

  # ---- 收尾验证 ----
  - { id: verify, action: run_cmd, phase: verify, needs: [untaint],
      cmd: "KUBECONFIG=/etc/kubernetes/admin.conf kubectl get nodes -o wide" }
handlers:
  - { id: restart_containerd, action: service, name: containerd, state: restarted }
teardown:
  # kubeadm 自带 reset —— 真正的清理(运行时状态:etcd/CNI/iptables/挂载),
  # 不是 init 的逆(D-049 的活例子)。
  - { id: reset, action: run_cmd, cmd: "kubeadm reset -f --cri-socket=unix:///run/containerd/containerd.sock || true" }
  - { id: rm_cni,   action: file, path: /etc/cni/net.d, state: absent, needs: [reset] }
  - { id: rm_kube,  action: file, path: /etc/kubernetes, state: absent, needs: [reset] }
  - { id: rm_kubeconfig, action: file, path: /root/.kube, state: absent, needs: [reset] }
  - { id: flush_ipt, action: run_cmd, needs: [reset],
      cmd: "iptables -F && iptables -t nat -F && iptables -t mangle -F || true" }
  - { id: stop_kubelet, action: service, name: kubelet, state: stopped, enabled: false, needs: [reset] }
