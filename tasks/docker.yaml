# docker(B1 静态二进制形态,D-047/D-048):官方 static tarball → 解包到 /usr/local/bin
# → 写 containerd/docker systemd unit → daemon-reload → 起服务。纯 binary material,
# 离线可行(build 把 tgz 打进 OCI artifact),按目标机 arch 选 amd64/arm64 变体。
# daemon.json 变更 → notify 重启 handler。
name: docker
hosts: all
vars:
  version: "27.3.1"
materials:
  # docker 官方静态包:url 里 amd64=x86_64、arm64=aarch64(命名各异,故每变体写全 url)。
  - name: docker-tgz
    kind: file
    arch: amd64
    url_tmpl: "https://download.docker.com/linux/static/stable/x86_64/docker-{{version}}.tgz"
  - name: docker-tgz
    kind: file
    arch: arm64
    url_tmpl: "https://download.docker.com/linux/static/stable/aarch64/docker-{{version}}.tgz"
actions:
  # unarchive 直接吃 material(取+解压一步,D-073)。tarball 内是 docker/ 目录,
  # strip 1 → 二进制直接落 /usr/local/bin;creates 已解出 dockerd 则跳过(幂等)。
  - id: extract
    action: unarchive
    material: docker-tgz
    to: /usr/local/bin
    strip: 1
    creates: /usr/local/bin/dockerd
  - id: containerd_unit
    action: copy
    dest: /etc/systemd/system/containerd.service
    content: |
      [Unit]
      Description=containerd container runtime
      After=network.target

      [Service]
      ExecStart=/usr/local/bin/containerd
      Restart=always
      Delegate=yes
      KillMode=process
      LimitNOFILE=infinity

      [Install]
      WantedBy=multi-user.target
    needs: [extract]
    notify: [reload_systemd]
  - id: docker_unit
    action: copy
    dest: /etc/systemd/system/docker.service
    content: |
      [Unit]
      Description=Docker Application Container Engine
      After=network-online.target containerd.service
      Wants=network-online.target
      Requires=containerd.service

      [Service]
      Type=notify
      ExecStart=/usr/local/bin/dockerd -H unix:// --containerd=/run/containerd/containerd.sock
      Restart=always
      LimitNOFILE=infinity
      LimitNPROC=infinity
      Delegate=yes
      KillMode=process

      [Install]
      WantedBy=multi-user.target
    needs: [extract]
    notify: [reload_systemd]
  - id: daemon
    action: copy
    dest: /etc/docker/daemon.json
    content: |
      {
        "registry-mirrors": ["https://docker.m.daocloud.io"],
        "exec-opts": ["native.cgroupdriver=systemd"],
        "log-driver": "json-file",
        "log-opts": { "max-size": "100m", "max-file": "3" },
        "storage-driver": "overlay2"
      }
    needs: [extract]
    notify: [restart_docker]
  - id: svc_containerd
    # service 原语自带 daemon-reload && enable && start;首跑 unit 必变→其内 reload
    # 让 systemd 看见新 unit。unit 未变时(重跑)is-active 命中→整步跳过,不重载(幂等)。
    action: service
    name: containerd
    state: started
    enabled: true
    needs: [containerd_unit]
  - id: svc_docker
    action: service
    name: docker
    state: started
    enabled: true
    needs: [svc_containerd, docker_unit, daemon]
  - id: verify
    action: shell
    phase: verify
    cmd: "docker --version && docker info --format '{{.ServerVersion}}'"
    needs: [svc_docker]
handlers:
  # unit 文件变更才触发 reload(notify);unit 未变则不跑 → 幂等。
  - id: reload_systemd
    action: shell
    cmd: "systemctl daemon-reload"
  - id: restart_docker
    action: service
    name: docker
    state: restarted
# teardown(D-049):crater delete docker 跑这段。注意它清的不止"我们装的"——
# /var/lib/docker、/var/lib/containerd 是 docker 运行期自己长出来的(镜像/容器/卷),
# install 步骤从没创建过,逆推 actions 永远碰不到;这是产品知识,只能作者声明。
teardown:
  - id: stop_docker
    action: service
    name: docker
    state: stopped
    enabled: false
  - id: stop_containerd
    action: service
    name: containerd
    state: stopped
    enabled: false
    needs: [stop_docker]
  # 运行时数据(作者才知道在哪):
  - id: rm_docker_data
    action: file
    path: /var/lib/docker
    state: absent
    needs: [stop_docker]
  - id: rm_containerd_data
    action: file
    path: /var/lib/containerd
    state: absent
    needs: [stop_containerd]
  # 我们装的物料 + 配置:
  - id: rm_bin_dockerd
    action: file
    path: /usr/local/bin/dockerd
    state: absent
    needs: [stop_docker]
  - id: rm_bin_docker
    action: file
    path: /usr/local/bin/docker
    state: absent
    needs: [stop_docker]
  - id: rm_bin_ctr
    action: file
    path: /usr/local/bin/containerd
    state: absent
    needs: [stop_containerd]
  - id: rm_bin_runc
    action: file
    path: /usr/local/bin/runc
    state: absent
    needs: [stop_containerd]
  - id: rm_unit_docker
    action: file
    path: /etc/systemd/system/docker.service
    state: absent
    needs: [stop_docker]
  - id: rm_unit_ctr
    action: file
    path: /etc/systemd/system/containerd.service
    state: absent
    needs: [stop_containerd]
  - id: rm_etc_docker
    action: file
    path: /etc/docker
    state: absent
    needs: [stop_docker]
  - id: reload
    action: shell
    cmd: "systemctl daemon-reload"
    needs: [rm_unit_docker, rm_unit_ctr]
