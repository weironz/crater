# mysql(task):装包 + 起服务。服务名按 OS 分叉(debian=mysql / rhel=mysqld),
# 用 when_os 封闭枚举拆成两个 service action(D-036:条件在引擎,不在 YAML 写表达式)。
name: mysql
hosts: all
actions:
  - id: install
    action: pkg_install
    packages:
      debian: [mysql-server]
      rhel: [mysql-server]
  - id: svc_debian
    action: service
    name: mysql
    state: started
    enabled: true
    when_os: [debian]
    needs: [install]
  - id: svc_rhel
    action: service
    name: mysqld
    state: started
    enabled: true
    when_os: [rhel]
    needs: [install]
  - id: verify
    action: run_cmd
    phase: verify
    cmd: "(mysql --version || mysqld --version) 2>&1 | head -1"
    needs: [install]
