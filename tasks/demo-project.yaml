# 示范 project(D-083):有序编排多个 task,每个 play 引用一个 task + 覆盖 hosts/vars。
name: demo-platform
description: "示范:先全局装 yq,再在 controlplane 部署 k8s"
plays:
  - name: 装 yq(所有节点)
    source: demo-roles
    hosts: all
  - name: 部署 K8s(控制面)
    source: k8s-ha
    hosts: controlplane
    vars:
      pod_cidr: "10.244.0.0/16"
