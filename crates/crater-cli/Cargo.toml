[package]
name = "crater-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "crater"
path = "src/main.rs"

[dependencies]
crater-core = { path = "../crater-core" }
crater-ir = { path = "../crater-ir" }
serde_json = "1"
serde = { workspace = true }   # 契约 API 的查询参数反序列化
anyhow.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures = "0.3"
axum = "0.8"             # crater ui: pure-Rust web (hyper/tower/tokio, no C)
tempfile = "3"           # 离线闭包解包(不只是测试用)
libc = "0.2"             # job 取消:SIGTERM

[dev-dependencies]
async-trait.workspace = true   # FakeExec in agent.rs tests (D-095)
