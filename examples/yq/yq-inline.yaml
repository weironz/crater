# Path B demo: ONE file holds both inventory and the recipe (inline).
# No components/yq/ directory needed — components/ is now an optional reuse lib.
# Run:  crater apply -f examples/yq-inline.yaml
inventory:
  hosts:
    - name: test
      address: 192.168.73.11
      user: root
      port: 22
      password: "123456"
      roles: [yq]

components:
  - name: yq
    version: "4.53.2"
    # ↓ inline recipe (presence of install:/verify: switches to Path B)
    install:
      - action: download
        url_tmpl: "https://github.com/mikefarah/yq/releases/download/v{{version}}/yq_linux_amd64"
        dest: /usr/local/bin/yq
      - action: run_cmd
        cmd: "chmod +x /usr/local/bin/yq"
        check: "test -x /usr/local/bin/yq"
    verify:
      - action: run_cmd
        cmd: "/usr/local/bin/yq --version"
