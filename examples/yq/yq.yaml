# Minimal online-deploy spec for the yq demo.
# Run (dry-run):  crater apply -f examples/yq.yaml
# Run (execute):  crater apply -f examples/yq.yaml --apply
#
# inventory = 装到哪（主机清单，含 SSH 凭据）；components = 装什么。
# host.roles 充当过滤器：只装 roles 里列出的组件（留空则装全部 components）。
inventory:
  hosts:
    - name: test
      address: 192.168.73.11
      user: root
      port: 22
      password: "123456"        # 演示用；生产应走密钥/凭据存储(N4)，勿入库
      roles: [yq]

components:
  - name: yq
    version: "4.53.2"

offline: false
