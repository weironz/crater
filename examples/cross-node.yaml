# Cross-node register/hostvars demo (D-030): the leader registers a fact; the
# follower consumes it via {{ hostvars.leader.token }}. This is the mechanism
# behind real clustering (e.g. k3s server token → agent join).
# Hosts run in inventory order, so the leader registers before the follower reads.
# Run from repo root:  crater apply -f examples/cross-node.yaml
inventory:
  hosts:
    - { name: leader,   address: 192.168.73.11, user: root, port: 22, password: "123456", roles: [producer] }
    - { name: follower, address: 192.168.73.12, user: root, port: 22, password: "123456", roles: [consumer] }

components:
  - name: producer
    install:
      - action: run_cmd
        cmd: "echo token-from-$(hostname) > /tmp/crater-token"
        check: "test -f /tmp/crater-token"
    register:
      - { name: token, cmd: "cat /tmp/crater-token" }

  - name: consumer
    install:
      - action: run_cmd
        cmd: "echo 'leader token = {{ hostvars.leader.token }}' > /tmp/crater-received"
    verify:
      - action: run_cmd
        cmd: "cat /tmp/crater-received"
