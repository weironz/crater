# Example spec for building an offline node_exporter bundle:
#   crater build -f examples/node_exporter.yaml -o ne.bundle
#   crater deploy --bundle ne.bundle --host 192.168.73.11 --password 123456 --apply
inventory:
  hosts:
    - name: node1
      address: 192.168.73.11
      user: root
      port: 22
      roles: [node_exporter]

components:
  - name: node_exporter
    version: "1.8.2"

offline: true
