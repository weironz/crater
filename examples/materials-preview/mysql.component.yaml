# ⚠️ 设计预览（D-034 下一阶段），不是当前生效组件。
# 与 components/mysql/component.yaml 对比：把"离线要装什么"从 pkg_install 的
# 自由动作里解放成显式 materials 段。当前引擎只接线 kind:binary（yq 闭环已证），
# kind:os_package 尚未接线——本文件演示目标结构 + 暴露问题一/四。
#
# 关键差异（vs yq）：mysql 没有一个 url_tmpl，它的整个离线依赖是 OS 包（deb/rpm），
# 而且按 OS 分叉。build 扫 install 永远看不见这些；只有显式声明才打得进包。
name: mysql
version_default: "8.0"
supported_os: [ubuntu, debian, rhel, centos, rocky]

materials:
  # 主包 + 运行时依赖闭包。build --os ubuntu 时取 debian: 列表下成 .deb；
  # --os rhel 时取 rhel: 列表下成 .rpm。两套物料按 OS 分平台进 image index（问题四）。
  - name: mysql-server
    kind: os_package
    packages:
      debian: [mysql-server]
      rhel: [mysql-server]
  - name: mysql-runtime-deps
    kind: os_package
    packages:
      debian: [libaio1, libnuma1]
      rhel: [libaio, numactl-libs]

preflight:
  - check: port_free
    port: 3306
  - check: disk_free
    path: /var/lib/mysql
    min_gb: 2

install:
  # os_package 物料的"安装"不是放文件：在线→系统包管理器直接装；
  # 离线→把打进包的 .deb/.rpm 摆成本地 file repo，再从本地装（apt/dnf 指向本地源）。
  # 引擎按 material.kind 决定动作，spec 只引用逻辑名。
  - action: pkg_install
    from_material: mysql-server
  - action: pkg_install
    from_material: mysql-runtime-deps
  - action: run_cmd
    cmd: "systemctl enable --now mysql 2>/dev/null || systemctl enable --now mysqld"

verify:
  - action: run_cmd
    cmd: "(mysql --version || mysqld --version) 2>&1 | head -1"
  - action: run_cmd
    cmd: "for i in $(seq 1 20); do (mysqladmin ping 2>/dev/null | grep -q alive) && break; sleep 2; done; mysqladmin ping 2>&1 || true"
