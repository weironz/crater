# Multi-node demo: deploy yq to two hosts. apply_spec iterates inventory.hosts
# (sequentially); host.roles filters which components land on each host.
# Run from repo root:  crater apply -f examples/multi-node.yaml
inventory:
  hosts:
    - { name: n11, address: 192.168.73.11, user: root, port: 22, password: "123456", roles: [yq] }
    - { name: n12, address: 192.168.73.12, user: root, port: 22, password: "123456", roles: [yq] }

components:
  - { name: yq, version: "4.53.2" }
