# Two-node k3s cluster — the end-to-end validation of cross-node register/hostvars (D-030).
#
#   server (192.168.73.11): install k3s server → register node-token + url
#   agent  (192.168.73.12): join via K3S_URL/K3S_TOKEN = {{ hostvars.server.* }}
#
# Hosts run in inventory order, so the server installs + registers before the
# agent joins. Verify cluster membership after:
#   crater run --host 192.168.73.11 --password 123456 -- "k3s kubectl get nodes"
inventory:
  hosts:
    - { name: server, address: 192.168.73.11, user: root, port: 22, password: "123456", roles: [k3s] }
    - { name: agent,  address: 192.168.73.12, user: root, port: 22, password: "123456", roles: [k3s-agent] }

components:
  - { name: k3s }
  - { name: k3s-agent }
