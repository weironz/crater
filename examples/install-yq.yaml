# 通用 task(D-037):crater apply <动作>。
# 这不是"装某产品"的专用描述,而是"在目标机达成一组状态"的声明式动作集。
# 严守 D-036:全是数据——动作只声明"用哪个原语 + 参数 + 取哪个值",
# 条件/排序/循环全部由 Rust 引擎处理(when_os 是封闭枚举开关,不是表达式;
# needs 由引擎拓扑排序;{{version}} 只做取值)。
name: install-yq
hosts: all                     # targeting:组名/all(声明式,引擎按 inventory 解析)
vars:
  version: "4.53.2"
materials:                     # 物料闭包(D-034),crater build 据此打离线包
  # 多 arch(D-048):同名 material 各声明一个 arch,place 按目标机 uname -m 选变体。
  - name: yq-bin
    kind: file
    arch: amd64
    url_tmpl: "https://github.com/mikefarah/yq/releases/download/v{{version}}/yq_linux_amd64"
  - name: yq-bin
    kind: file
    arch: arm64
    url_tmpl: "https://github.com/mikefarah/yq/releases/download/v{{version}}/yq_linux_arm64"

actions:
  - id: place_yq
    action: place
    material: yq-bin
    dest: /usr/local/bin/yq
    mode: "0755"

  - id: verify
    action: shell
    phase: verify
    cmd: "/usr/local/bin/yq --version"
    needs: [place_yq]          # 引擎据此排在 place_yq 之后

  # 封闭枚举条件:仅 rhel 系执行。目标非 rhel 时,引擎在 Rust 里把这步过滤掉
  # (它根本不进 plan)——不是 YAML 在"判断",是引擎在判断。
  - id: rhel_only_note
    action: shell
    phase: verify
    when_os: [rhel]
    cmd: "echo 'rhel-specific step'"
